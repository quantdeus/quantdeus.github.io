<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#9be8ff">
  <title>QuantDeus — WordPress</title>
  <meta name="description" content="QuantDeus Holding: технологии, исследования, автоматизация, медиа и сообщество на единой WordPress-платформе.">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta name="referrer" content="no-referrer">
  <link rel="canonical" href="https://quantdeus.github.io/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="QuantDeus — WordPress">
  <meta property="og:description" content="QuantDeus Holding на WordPress: технологии, исследования, автоматизация, медиа и сообщество.">
  <meta property="og:url" content="https://quantdeus.github.io/">
  <meta property="og:site_name" content="QuantDeus">
  <style>
    :root{--ink:#072735;--muted:#4f7480;--glass:rgba(255,255,255,.82);--line:rgba(10,112,137,.14)}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:linear-gradient(180deg,#bcefff,#e8fbff 50%,#dff8ed);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
    #wordpress{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
    .loading{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 16%,#fff,#dffaff 42%,#dff8ed)}
    .loading.hide{display:none}
    .card{width:min(440px,100%);padding:30px;border:1px solid #fff;border-radius:30px;background:var(--glass);backdrop-filter:blur(18px);box-shadow:0 22px 70px rgba(7,89,108,.13);text-align:center}
    .orb{width:58px;height:58px;margin:0 auto 16px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff 0 9%,#79e6ff 11% 34%,#13a6c5 55%,#0a6d84 80%);box-shadow:0 10px 34px rgba(0,139,169,.28)}
    h1{margin:0 0 8px;font-size:clamp(28px,7vw,42px);letter-spacing:-.04em}
    p{margin:0;color:var(--muted);line-height:1.55}
    .spinner{width:38px;height:38px;margin:22px auto 0;border:4px solid rgba(9,122,146,.12);border-top-color:#0ba5c4;border-radius:50%;animation:s .8s linear infinite}
    .fallback{display:none;margin-top:18px}
    .fallback.show{display:block}
    .fallback a{display:inline-flex;padding:11px 16px;border-radius:999px;background:#0b91aa;color:#fff;text-decoration:none;font-weight:800}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="card">
      <div class="orb"></div>
      <h1>QuantDeus</h1>
      <p id="status">Запускаю WordPress на основном адресе…</p>
      <div class="spinner"></div>
      <div class="fallback" id="fallback"><a id="direct" href="#" target="_blank" rel="noopener">Открыть WordPress напрямую</a></div>
    </div>
  </div>
  <iframe id="wordpress" title="QuantDeus WordPress" allow="clipboard-read; clipboard-write"></iframe>
  <noscript><p><a href="https://playground.wordpress.net/">Для запуска QuantDeus WordPress включите JavaScript.</a></p></noscript>
  <script>
    (() => {
      const blueprint = 'https://raw.githubusercontent.com/quantdeus/quantdeus.github.io/main/wordpress/blueprint.json';
      const playgroundOrigin = 'https://playground.wordpress.net';
      const playground = playgroundOrigin + '/?mode=seamless&blueprint-url=' + encodeURIComponent(blueprint);
      const telegramBotAuthApi = 'https://quantdeus.vercel.app/api/quantdeus/bot-auth';
      const githubAuthApi = 'https://quantdeus.vercel.app/api/quantdeus/github-auth';
      const telegramAssertionKey = 'qd_telegram_assertion';
      const telegramErrorKey = 'qd_telegram_error';
      const githubAssertionKey = 'qd_github_assertion';
      const githubErrorKey = 'qd_github_error';
      const frame = document.getElementById('wordpress');
      const loading = document.getElementById('loading');
      const status = document.getElementById('status');
      const fallback = document.getElementById('fallback');
      const direct = document.getElementById('direct');

      (() => {
        const current = new URL(location.href);
        const telegramAssertion = current.searchParams.get('qd_telegram_assertion');
        const telegramError = current.searchParams.get('qd_telegram_error');
        const githubAssertion = current.searchParams.get('qd_github_assertion');
        const githubError = current.searchParams.get('qd_github_error');

        if (telegramAssertion) sessionStorage.setItem(telegramAssertionKey, telegramAssertion);
        if (telegramError) sessionStorage.setItem(telegramErrorKey, telegramError);
        if (githubAssertion) sessionStorage.setItem(githubAssertionKey, githubAssertion);
        if (githubError) sessionStorage.setItem(githubErrorKey, githubError);

        if (telegramAssertion || telegramError || githubAssertion || githubError) {
          current.searchParams.delete('qd_telegram_assertion');
          current.searchParams.delete('qd_telegram_error');
          current.searchParams.delete('qd_github_assertion');
          current.searchParams.delete('qd_github_error');
          history.replaceState(null, '', current.pathname + (current.search ? current.search : '') + current.hash);
        }
      })();

      function postToWordPress(message) {
        if (!frame.contentWindow) return;
        // WordPress Playground can change its internal document origin while
        // navigating wp-login/wp-admin. The exact frame window is the trust
        // boundary; using "*" here keeps the parent bridge alive after logout.
        frame.contentWindow.postMessage(message, '*');
      }

      window.addEventListener('message', event => {
        if (event.source !== frame.contentWindow) return;
        const message = event.data || {};
        if (message.type === 'qd:telegram-login') {
          if (message.action === 'start') {
            sessionStorage.removeItem(telegramAssertionKey);
            sessionStorage.removeItem(telegramErrorKey);
            const start = new URL(telegramBotAuthApi);
            start.searchParams.set('action', 'start');
            location.assign(start.toString());
            return;
          }
          if (message.action === 'consume') {
            const assertion = sessionStorage.getItem(telegramAssertionKey) || '';
            const error = sessionStorage.getItem(telegramErrorKey) || '';
            postToWordPress(assertion
              ? {type:'qd:telegram-result',ok:true,assertion}
              : {type:'qd:telegram-result',ok:false,error:error || 'telegram_no_pending_assertion'});
            return;
          }
        }
        if (message.type === 'qd:github-login') {
          if (message.action === 'start') {
            sessionStorage.removeItem(githubAssertionKey);
            sessionStorage.removeItem(githubErrorKey);
            const start = new URL(githubAuthApi);
            start.searchParams.set('action', 'start');
            start.searchParams.set('return_to', location.origin + '/');
            location.assign(start.toString());
            return;
          }
          if (message.action === 'consume') {
            const assertion = sessionStorage.getItem(githubAssertionKey) || '';
            const error = sessionStorage.getItem(githubErrorKey) || '';
            postToWordPress(assertion
              ? {type:'qd:github-result',ok:true,assertion}
              : {type:'qd:github-result',ok:false,error:error || 'github_no_pending_assertion'});
            return;
          }
        }
        if (message.type === 'qd:telegram-consumed' && message.ok) {
          sessionStorage.removeItem(telegramAssertionKey);
          sessionStorage.removeItem(telegramErrorKey);
          return;
        }
        if (message.type === 'qd:github-consumed' && message.ok) {
          sessionStorage.removeItem(githubAssertionKey);
          sessionStorage.removeItem(githubErrorKey);
          return;
        }
        if (message.type === 'qd:logout') {
          sessionStorage.removeItem(telegramAssertionKey);
          sessionStorage.removeItem(telegramErrorKey);
          sessionStorage.removeItem(githubAssertionKey);
          sessionStorage.removeItem(githubErrorKey);
        }
      });

      direct.href = playground;
      frame.src = playground;
      frame.addEventListener('load', () => {
        loading.classList.add('hide');
      }, {once:true});
      setTimeout(() => {
        if (!loading.classList.contains('hide')) {
          status.textContent = 'WordPress запускается дольше обычного. Можно открыть его напрямую.';
          fallback.classList.add('show');
        }
      }, 30000);
    })();
  </script>
</body>
</html>
