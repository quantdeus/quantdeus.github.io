<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07131d" />
  <title>QuantDeus WordPress</title>
  <style>
    :root{--bg:#07131d;--panel:#0f2535;--line:rgba(190,235,255,.16);--text:#eefaff;--muted:#8fb0c3;--accent:#55d8ff}
    *{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
    body{display:grid;grid-template-rows:auto 1fr;overflow:hidden}
    header{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);background:rgba(7,19,29,.96);min-height:58px}
    .brand{min-width:0;flex:1}.brand b{display:block;font-size:14px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
    .dot{width:10px;height:10px;border-radius:50%;background:#ffc96b;box-shadow:0 0 14px rgba(255,201,107,.4)}
    .dot.live{background:#75f0a9;box-shadow:0 0 14px rgba(117,240,169,.45)}
    .actions{display:flex;gap:7px}.actions a,.actions button{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);padding:8px 10px;text-decoration:none;font:inherit;font-size:11px;font-weight:750;cursor:pointer}
    .actions .primary{background:var(--accent);color:#04131c;border-color:transparent}
    #frameWrap{position:relative;min-height:0;background:white}
    iframe{display:block;width:100%;height:100%;border:0;background:white}
    .loading{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#17364c,#07131d 62%);z-index:3;transition:opacity .35s}
    .loading.hide{opacity:0;pointer-events:none}.card{text-align:center;padding:28px}.spinner{width:42px;height:42px;margin:0 auto 14px;border:3px solid rgba(255,255,255,.14);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}.card p{margin:6px 0;color:var(--muted);font-size:12px}
    @keyframes spin{to{transform:rotate(360deg)}}@media(max-width:620px){header{padding:8px}.actions a:nth-child(2){display:none}.brand small{max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
  </style>
</head>
<body>
<header>
  <div class="dot" id="statusDot"></div>
  <div class="brand"><b>QuantDeus WordPress</b><small id="statusText">Запуск PHP/WASM + WordPress…</small></div>
  <div class="actions">
    <a href="/">← QuantDeus</a>
    <a href="/coordination/">🧭 Center</a>
    <button class="primary" id="reloadBtn" type="button">↻ WP</button>
  </div>
</header>
<div id="frameWrap">
  <div class="loading" id="loading"><div class="card"><div class="spinner"></div><b>Запускаем WordPress</b><p>PHP 8.3 • WordPress latest • browser sandbox</p></div></div>
  <iframe id="wp" title="QuantDeus WordPress" allow="clipboard-read; clipboard-write"></iframe>
</div>
<script>
const frame=document.getElementById("wp");
const loading=document.getElementById("loading");
const statusDot=document.getElementById("statusDot");
const statusText=document.getElementById("statusText");

async function boot(){
  try{
    const response=await fetch("./blueprint.json",{cache:"no-store"});
    if(!response.ok) throw new Error("blueprint "+response.status);
    const blueprint=await response.json();
    const encoded=encodeURIComponent(JSON.stringify(blueprint));
    const url="https://playground.wordpress.net/?mode=seamless&site-slug=quantdeus&language=ru_RU#"+encoded;
    frame.src=url;
    frame.addEventListener("load",()=>{
      loading.classList.add("hide");
      statusDot.classList.add("live");
      statusText.textContent="WordPress работает в браузере • автосохранение Playground";
    },{once:true});
  }catch(err){
    console.error(err);
    statusText.textContent="Ошибка запуска WordPress: "+err.message;
  }
}
document.getElementById("reloadBtn").onclick=()=>{loading.classList.remove("hide");statusDot.classList.remove("live");statusText.textContent="Перезапуск WordPress…";frame.src="about:blank";setTimeout(boot,120)};
boot();
</script>
</body>
</html>
