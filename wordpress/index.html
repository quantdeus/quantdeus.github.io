<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#9be8ff"><title>QuantDeus WordPress Developer Preview</title><style>
:root{--ink:#072735;--glass:rgba(255,255,255,.78);--line:rgba(10,112,137,.14)}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#bcefff,#e8fbff 50%,#dff8ed)}body{display:grid;grid-template-rows:auto 1fr;overflow:hidden}header{display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(233,252,255,.74);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.8)}.orb{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff 0 10%,#79e6ff 12% 35%,#13a6c5 55%,#0a6d84 80%);box-shadow:0 7px 22px rgba(0,139,169,.25)}.brand{flex:1}.brand b{display:block}.brand small{color:#4f7480}.actions{display:flex;gap:7px}.actions a,.actions button{border:1px solid var(--line);border-radius:999px;background:var(--glass);padding:8px 11px;color:#0a6175;text-decoration:none;font:inherit;font-size:12px;font-weight:800;cursor:pointer}#wrap{position:relative;min-height:0;background:#fff}iframe{width:100%;height:100%;border:0}.loading{position:absolute;inset:0;z-index:3;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#fff,#dffaff 40%,#dff8ed)}.loading.hide{display:none}.card{background:var(--glass);border:1px solid #fff;border-radius:28px;padding:28px;text-align:center;box-shadow:0 20px 60px rgba(7,89,108,.12);max-width:440px}.spinner{width:44px;height:44px;border:4px solid rgba(9,122,146,.12);border-top-color:#0ba5c4;border-radius:50%;margin:0 auto 14px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:650px){.actions a:first-child{display:none}.brand small{font-size:10px}}
</style></head><body><header><div class="orb"></div><div class="brand"><b>QuantDeus WordPress Developer Preview</b><small id="status">GitHub source → WordPress Playground</small></div><div class="actions"><a href="/">← Repository Pages</a><a id="direct" href="#" target="_blank" rel="noopener">↗ Playground</a><button id="reload" aria-label="Перезапустить">↻</button></div></header><div id="wrap"><div class="loading" id="loading"><div class="card"><div class="spinner"></div><h2>QuantDeus WordPress</h2><p>Developer preview. Production WordPress is owner-managed outside this GitHub Pages iframe.</p></div></div><iframe id="frame" title="QuantDeus WordPress Developer Preview" allow="clipboard-read; clipboard-write"></iframe></div><script>
const frame=document.getElementById('frame'),loading=document.getElementById('loading'),status=document.getElementById('status');const blueprint='https://raw.githubusercontent.com/quantdeus/quantdeus.github.io/main/wordpress/blueprint.json';const url='https://playground.wordpress.net/?mode=seamless&blueprint-url='+encodeURIComponent(blueprint);document.getElementById('direct').href=url;function boot(){loading.classList.remove('hide');status.textContent='GitHub source → WordPress Playground';frame.src=url;frame.addEventListener('load',()=>{loading.classList.add('hide');status.textContent='Developer preview · canonical runtime = WordPress';},{once:true})}document.getElementById('reload').onclick=boot;boot();
</script></body></html>
