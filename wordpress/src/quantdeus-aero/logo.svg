<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-labelledby="title desc">
  <title id="title">QuantDeus</title>
  <desc id="desc">QuantDeus ringed aqua planet and wordmark.</desc>
  <defs>
    <radialGradient id="planet" cx="32%" cy="24%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".18" stop-color="#9ff5ff"/>
      <stop offset=".55" stop-color="#22c8e8"/>
      <stop offset="1" stop-color="#096a83"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" x2="1">
      <stop stop-color="#7fffd4"/>
      <stop offset=".5" stop-color="#65ddff"/>
      <stop offset="1" stop-color="#b99cff"/>
    </linearGradient>
  </defs>
  <g transform="translate(12 8)">
    <circle cx="72" cy="72" r="48" fill="url(#planet)"/>
    <ellipse cx="72" cy="72" rx="72" ry="22" fill="none" stroke="url(#ring)" stroke-width="8" transform="rotate(-14 72 72)"/>
    <circle cx="54" cy="52" r="8" fill="#fff" opacity=".8"/>
    <path d="M38 90c18 13 45 15 69 0-9 23-29 37-51 33-12-2-20-13-18-33Z" fill="#74e6a4" opacity=".88"/>
  </g>
  <text x="168" y="91" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="66" font-weight="800" letter-spacing="-3" fill="#073646">QuantDeus</text>
  <text x="171" y="124" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#0a8ba5">NEON HORIZON</text>
</svg>