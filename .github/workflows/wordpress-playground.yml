name: QuantDeus WordPress Platform

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'wordpress/**'
      - 'assets/portal-shell.css'
      - 'assets/portal-shell.js'
      - 'federation/**'
      - 'horizons/**'
      - 'research/**'
      - 'projects/**'
      - 'ai-fleet/**'
      - 'community/**'
      - 'knowledge/**'
      - 'manifesto/**'
      - 'about/**'
      - 'ksenia-cherednikova/**'
      - 'login/**'
      - 'assets/portal-shell.css'
      - 'assets/portal-shell.js'
      - 'federation/**'
      - 'horizons/**'
      - 'research/**'
      - 'projects/**'
      - 'ai-fleet/**'
      - 'community/**'
      - 'knowledge/**'
      - 'manifesto/**'
      - 'about/**'
      - 'ksenia-cherednikova/**'
      - 'login/**'
      - 'vercel-dispatcher/api/quantdeus/github-auth.js'
      - 'vercel-dispatcher/api/quantdeus/bot-auth.js'
      - 'vercel-dispatcher/api/quantdeus/telegram.js'
      - 'vercel-dispatcher/lib/github-auth.js'
      - 'vercel-dispatcher/lib/telegram-bot-auth.js'
      - 'docs/WORDPRESS_PLATFORM_MIGRATION.md'
      - '.github/workflows/wordpress-playground.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'wordpress/**'
      - 'vercel-dispatcher/api/quantdeus/github-auth.js'
      - 'vercel-dispatcher/api/quantdeus/bot-auth.js'
      - 'vercel-dispatcher/api/quantdeus/telegram.js'
      - 'vercel-dispatcher/lib/github-auth.js'
      - 'vercel-dispatcher/lib/telegram-bot-auth.js'
      - 'docs/WORDPRESS_PLATFORM_MIGRATION.md'
      - '.github/workflows/wordpress-playground.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantdeus-wordpress-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wordpress-platform-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate canonical WordPress source
        run: |
          set -euo pipefail
          test -f index.html
          test -f wordpress/index.html
          test -f wordpress/blueprint.json
          test -f assets/portal-shell.css
          test -f assets/portal-shell.js
          grep -q 'https://quantdeus.vercel.app/' index.html
          grep -q 'Публичное зеркало QuantDeus' index.html
          if grep -q 'playground.wordpress.net' index.html; then echo "GitHub Pages root must be the Vercel mirror, not Playground"; exit 1; fi
          grep -q "location.replace('/')" wordpress/index.html
          test -f wordpress/src/quantdeus-core/quantdeus-core.php
          test -f wordpress/src/quantdeus-aero/style.css
          test -f wordpress/src/quantdeus-aero/functions.php
          test -f wordpress/src/quantdeus-aero/front-page.php
          test -f wordpress/src/quantdeus-aero/header.php
          test -f wordpress/src/quantdeus-aero/footer.php
          test -f wordpress/src/quantdeus-aero/page-login.php
          test -f wordpress/src/quantdeus-aero/index.php
          test -f wordpress/src/quantdeus-aero/archive.php
          test -f wordpress/src/quantdeus-aero/single.php
          test -f wordpress/src/quantdeus-aero/page.php
          test -f wordpress/src/quantdeus-aero/page-federation.php
          test -f wordpress/src/quantdeus-aero/page-horizons.php
          test -f wordpress/src/quantdeus-aero/page-ai-fleet.php
          test -f wordpress/src/quantdeus-aero/page-manifesto.php
          test -f wordpress/src/quantdeus-aero/page-community.php
          test -f wordpress/src/quantdeus-aero/page-knowledge.php
          test -f wordpress/src/quantdeus-aero/page-ksenia-cherednikova.php
          test -f wordpress/src/quantdeus-aero/page-media.php
          test -f wordpress/src/quantdeus-aero/page-news.php
          test -f wordpress/src/quantdeus-aero/page-about.php
          test -f wordpress/src/quantdeus-aero/page-account.php
          test -f wordpress/src/quantdeus-aero/app.js
          test -f wordpress/src/quantdeus-aero/theme.json
          if find wordpress/src/quantdeus-aero -maxdepth 1 -name '*.svg' -print -quit | grep -q .; then echo "SVG runtime placeholders forbidden in QuantDeus Aero theme"; exit 1; fi
          test -f wordpress/src/quantdeus-aero/archive-qd_forum_thread.php
          test -f wordpress/src/quantdeus-aero/single-qd_forum_thread.php
          find wordpress/src -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check wordpress/src/quantdeus-aero/app.js
          test -f vercel-dispatcher/api/quantdeus/github-auth.js
          test -f vercel-dispatcher/api/quantdeus/bot-auth.js
          test -f vercel-dispatcher/lib/github-auth.js
          test -f vercel-dispatcher/lib/telegram-bot-auth.js
          node --check vercel-dispatcher/api/quantdeus/github-auth.js
          node --check vercel-dispatcher/api/quantdeus/bot-auth.js
          node --check vercel-dispatcher/api/quantdeus/telegram.js
          node --check vercel-dispatcher/lib/github-auth.js
          node --check vercel-dispatcher/lib/telegram-bot-auth.js
          grep -q "https://quantdeus.vercel.app/api/quantdeus/bot-auth" assets/portal-shell.js
          grep -q "https://quantdeus.vercel.app/api/quantdeus/github-auth" assets/portal-shell.js
          grep -q "canonical.href" assets/portal-shell.js
          if grep -q "Telegram.Login.auth" index.html; then echo "legacy Telegram Login SDK forbidden"; exit 1; fi
          grep -q "telegramBrokerUrl" wordpress/src/quantdeus-aero/app.js
          grep -q "syncTelegramBotSession" wordpress/src/quantdeus-aero/app.js
          grep -q "data-telegram-login" wordpress/src/quantdeus-aero/page-login.php
          grep -q "QuantDeus Store Bot" wordpress/src/quantdeus-aero/page-login.php
          grep -q "qdl_" vercel-dispatcher/api/quantdeus/telegram.js
          grep -q "issueTelegramBotAssertion" vercel-dispatcher/api/quantdeus/telegram.js
          grep -q "telegram_broker_login" wordpress/src/quantdeus-core/quantdeus-core.php
          grep -q "github_broker_login" wordpress/src/quantdeus-core/quantdeus-core.php
          grep -q "/session/logout" wordpress/src/quantdeus-core/quantdeus-core.php
          grep -q "data-qd-logout" wordpress/src/quantdeus-aero/page-login.php
          grep -q "qd:logout" wordpress/src/quantdeus-aero/app.js
          grep -q "githubBrokerUrl" wordpress/src/quantdeus-aero/app.js
          grep -q "permission_strategy" vercel-dispatcher/lib/github-auth.js
          grep -q "token_box" vercel-dispatcher/lib/github-auth.js
          grep -q "wp_nav_menu" wordpress/src/quantdeus-aero/header.php
          grep -q "theme_location'=>'primary'" wordpress/src/quantdeus-aero/header.php
          grep -q "register_nav_menus" wordpress/src/quantdeus-aero/functions.php
          grep -q "custom-logo" wordpress/src/quantdeus-aero/functions.php
          grep -q "WP_Customize_Media_Control" wordpress/src/quantdeus-aero/functions.php
          grep -q "qd_visual_header" wordpress/src/quantdeus-aero/functions.php
          grep -q '"wp": "7.1.2"' wordpress/blueprint.json
          if grep -R -q '<nav class="qd-links">' wordpress/src/quantdeus-aero/*.php; then echo "hard-coded header nav forbidden"; exit 1; fi
          if grep -q '"step"[[:space:]]*:[[:space:]]*"login"' wordpress/blueprint.json; then echo "public WordPress admin autologin forbidden"; exit 1; fi
          if grep -n "QD_\(OWNER\|ADMIN\)_TELEGRAM_IDS.*administrator" wordpress/src/quantdeus-core/quantdeus-core.php; then echo "Telegram must never grant administrator"; exit 1; fi
          grep -q "github_permission" wordpress/src/quantdeus-core/quantdeus-core.php
          grep -q "github_staff_only" wordpress/src/quantdeus-core/quantdeus-core.php
          grep -q "github_staff_session_valid" wordpress/src/quantdeus-core/quantdeus-core.php
          grep -q "github_broker_unavailable" wordpress/src/quantdeus-core/quantdeus-core.php
          grep -q "service_post" wordpress/src/quantdeus-core/quantdeus-core.php
          grep -q "qd_node" wordpress/src/quantdeus-core/quantdeus-core.php
          grep -q "qd_research" wordpress/src/quantdeus-core/quantdeus-core.php
          grep -q "qd_artifact" wordpress/src/quantdeus-core/quantdeus-core.php
          grep -q "qd_result" wordpress/src/quantdeus-core/quantdeus-core.php
          grep -q "Federation Interface v1" wordpress/src/quantdeus-aero/page-federation.php
          grep -q "Evidence Before Narrative" wordpress/src/quantdeus-aero/front-page.php
          grep -q "Current QuantDeus State" wordpress/src/quantdeus-aero/front-page.php
          if grep -q "aero-world.svg" wordpress/src/quantdeus-aero/front-page.php; then echo "SVG placeholder forbidden on portal homepage"; exit 1; fi
          grep -q "capability_type" wordpress/src/quantdeus-core/quantdeus-core.php
          grep -q "wp_add_dashboard_widget" wordpress/src/quantdeus-core/quantdeus-core.php
          grep -q "admin_url()" wordpress/src/quantdeus-aero/page-login.php
          if grep -q "admin.php?page=quantdeus" wordpress/src/quantdeus-aero/page-login.php; then echo "legacy custom control deck entry forbidden"; exit 1; fi
          grep -q "return 'qd_member';" wordpress/src/quantdeus-core/quantdeus-core.php
          if grep -q "QD_MODERATOR_TELEGRAM_IDS" wordpress/src/quantdeus-core/quantdeus-core.php; then echo "Telegram staff elevation forbidden"; exit 1; fi
          grep -q "home_url('/login/')" wordpress/src/quantdeus-aero/header.php
          grep -q "QuantDeus Store Bot" wordpress/src/quantdeus-aero/page-login.php
          grep -q "Войти через GitHub" wordpress/src/quantdeus-aero/page-login.php
          grep -q "write / maintain" wordpress/src/quantdeus-aero/page-login.php
          grep -q "admin" wordpress/src/quantdeus-aero/page-login.php
          ! grep -RniE 'hook\.[a-z0-9.-]*make\.com|api\.make\.com|MAKE_(TOKEN|API|WEBHOOK|SCENARIO|TEAM|ORG)|scenarioId[^A-Za-z0-9]' wordpress/src wordpress/blueprint.json || {
            echo "Active Make integration detected in canonical WordPress runtime"; exit 1;
          }
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('wordpress/blueprint.json','utf8'));
          const plugin=(b.steps||[]).find(x=>x.step==='installPlugin');
          const theme=(b.steps||[]).find(x=>x.step==='installTheme');
          if(plugin?.pluginData?.resource!=='git:directory') throw new Error('plugin must use git:directory');
          if(theme?.themeData?.resource!=='git:directory') throw new Error('theme must use git:directory');
          if(!String(plugin.pluginData.path).includes('wordpress/src/quantdeus-core')) throw new Error('core source path missing');
          if(!String(theme.themeData.path).includes('wordpress/src/quantdeus-aero')) throw new Error('aero source path missing');
          console.log('WordPress source contract OK');
          NODE

      - name: Execute QuantDeus WordPress Blueprint
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const source=path=>fs.readFileSync(path,'utf8');
          const canonical=JSON.parse(fs.readFileSync('wordpress/blueprint.json','utf8'));
          const keep=(canonical.steps||[]).filter(x=>['defineWpConfigConsts','setSiteOptions','runPHP'].includes(x.step));
          const config=keep.find(x=>x.step==='defineWpConfigConsts');
          const options=keep.find(x=>x.step==='setSiteOptions');
          const seed=keep.find(x=>x.step==='runPHP');
          const assertion=`<?php
          require_once '/wordpress/wp-load.php';
          if (!class_exists('QD_Core')) { throw new Exception('QD_Core not active'); }
          do_action('rest_api_init');
          $routes=rest_get_server()->get_routes();
          foreach (['/quantdeus/v1/health','/quantdeus/v1/services','/quantdeus/v1/session/logout','/quantdeus/v1/inquiries','/quantdeus/v1/forum','/quantdeus/v1/telegram/miniapp','/quantdeus/v1/telegram/login','/quantdeus/v1/telegram/broker','/quantdeus/v1/github/broker','/quantdeus/v1/github/config','/quantdeus/v1/github/start','/quantdeus/v1/github/callback'] as $route) {
              if (!isset($routes[$route])) { throw new Exception('Missing REST route: '.$route); }
          }
          foreach (['qd_node','qd_research','qd_artifact','qd_result','qd_project','qd_service','qd_forum_thread'] as $type) {
              if (!post_type_exists($type)) throw new Exception('Missing post type: '.$type);
          }
          foreach (['qd_horizon','qd_pillar','qd_research_domain'] as $taxonomy) {
              if (!taxonomy_exists($taxonomy)) throw new Exception('Missing taxonomy: '.$taxonomy);
          }
          foreach (['federation','horizons','ai-fleet','community','ksenia-cherednikova','media','news','knowledge','manifesto','about','account'] as $slug) {
              if (!get_page_by_path($slug,OBJECT,'page')) throw new Exception('Missing portal page: '.$slug);
          }
          $seed_node=get_page_by_path('quantdeus-core-node',OBJECT,'qd_node');
          if (!$seed_node || get_post_meta($seed_node->ID,'qd_evidence_grade',true)!=='B') throw new Exception('Federation seed node missing');
          $warp=get_page_by_path('warp-gravity-research',OBJECT,'qd_research');
          if (!$warp || get_post_meta($warp->ID,'qd_evidence_grade',true)!=='C') throw new Exception('Warp research evidence contract missing');
          $services=get_posts(['post_type'=>'qd_service','post_status'=>'publish','numberposts'=>20]);
          $ids=array_map(fn($p)=>(string)(get_post_meta($p->ID,'qd_service_id',true) ?: $p->post_name),$services);
          foreach (['business-automation','ksenia-cherednikova-concert'] as $required) {
              if (!in_array($required,$ids,true)) { throw new Exception('Missing service: '.$required); }
          }
          $forum=get_post_type_object('qd_forum_thread');
          if (!$forum || $forum->has_archive !== 'forum') { throw new Exception('Forum archive contract missing'); }
          foreach (['qd_member','qd_agent','qd_moderator'] as $role) {
              if (!get_role($role)) { throw new Exception('Missing role: '.$role); }
          }
          if (!get_role('qd_agent')->has_cap('qd_agent_context')) { throw new Exception('Agent context capability missing'); }
          $moderator=get_role('qd_moderator');
          if ($moderator->has_cap('manage_options')) { throw new Exception('Moderator must not have manage_options'); }
          foreach (['upload_files','moderate_comments','qd_moderate_forum','edit_qd_forum_threads','edit_others_qd_forum_threads','publish_qd_forum_threads','read_private_qd_forum_threads'] as $cap) {
              if (!$moderator->has_cap($cap)) { throw new Exception('Moderator missing forum moderation capability: '.$cap); }
          }
          foreach (['edit_posts','edit_others_posts','publish_posts','edit_private_posts','read_private_posts','edit_qd_inquiries','edit_qd_services','edit_qd_projects','edit_qd_evidence_items'] as $cap) {
              if ($moderator->has_cap($cap)) { throw new Exception('Moderator has over-broad capability: '.$cap); }
          }
          $administrator=get_role('administrator');
          if (!$administrator->has_cap('manage_options')) { throw new Exception('Administrator lost native WordPress capability'); }
          foreach (['edit_qd_services','edit_qd_inquiries','edit_qd_forum_threads','edit_qd_projects','edit_qd_evidence_items'] as $cap) {
              if (!$administrator->has_cap($cap)) { throw new Exception('Administrator missing QuantDeus capability: '.$cap); }
          }
          if (get_option('stylesheet') !== 'quantdeus-aero') { throw new Exception('QuantDeus Aero theme not active'); }
          qd_aero_ensure_login_page();
          $login=get_page_by_path('login',OBJECT,'page');
          if (!$login || $login->post_status!=='publish') { throw new Exception('Login page missing'); }
          qd_aero_ensure_primary_menu();
          $locations=get_nav_menu_locations();
          if (empty($locations['primary'])) { throw new Exception('Primary WordPress menu location missing'); }
          $menu=wp_get_nav_menu_object((int)$locations['primary']);
          $items=$menu ? wp_get_nav_menu_items($menu->term_id) : [];
          if (!$menu || count($items)<7) { throw new Exception('Primary WordPress menu was not fully seeded'); }
          $gallery_url=home_url('/#visuals');
          $has_gallery=false;
          foreach ($items as $item) {
              if (untrailingslashit((string)$item->url)===untrailingslashit($gallery_url)) { $has_gallery=true; break; }
          }
          if (!$has_gallery) { throw new Exception('Gallery is missing from Primary WordPress menu'); }

          $dynamic_id=wp_insert_post([
              'post_type'=>'qd_service','post_status'=>'publish','post_name'=>'runtime-custom-service',
              'post_title'=>'Runtime Custom Service','post_content'=>'Runtime dynamic service test',
          ],true);
          if (is_wp_error($dynamic_id)) { throw new Exception('Unable to create dynamic service fixture'); }
          update_post_meta($dynamic_id,'qd_service_id','runtime-custom-service');
          update_post_meta($dynamic_id,'qd_available','1');
          $_SERVER['REMOTE_ADDR']='127.0.0.77';
          $_SERVER['HTTP_USER_AGENT']='quantdeus-wordpress-smoke';
          $dynamic_req=new WP_REST_Request('POST','/quantdeus/v1/inquiries');
          $dynamic_req->set_param('service_id','runtime-custom-service');
          $dynamic_req->set_param('note','Dynamic WordPress service inquiry smoke test.');
          $dynamic_req->set_param('contact','qa@example.test');
          $dynamic_response=QD_Core::create_inquiry($dynamic_req);
          if (is_wp_error($dynamic_response) || $dynamic_response->get_status()!==201) {
              throw new Exception('Admin-created service cannot receive an inquiry');
          }
          update_post_meta($dynamic_id,'qd_available','0');
          $blocked_req=new WP_REST_Request('POST','/quantdeus/v1/inquiries');
          $blocked_req->set_param('service_id','runtime-custom-service');
          $blocked_req->set_param('note','Unavailable service inquiry should be rejected.');
          $blocked_req->set_param('contact','qa@example.test');
          $blocked_response=QD_Core::create_inquiry($blocked_req);
          if (!is_wp_error($blocked_response) || $blocked_response->get_error_code()!=='service_unavailable') {
              throw new Exception('Unavailable service inquiry was not rejected');
          }

          $broker=wp_remote_get('https://quantdeus.vercel.app/api/quantdeus/auth?health=1',['timeout'=>15]);
          if (is_wp_error($broker) || wp_remote_retrieve_response_code($broker)!==200) { throw new Exception('Telegram broker health unavailable'); }
          $broker_body=json_decode((string)wp_remote_retrieve_body($broker),true);
          if (empty($broker_body['ok']) || empty($broker_body['configured']) || empty($broker_body['client_id'])) { throw new Exception('Telegram broker health contract invalid'); }
          echo "QUANTDEUS_WORDPRESS_RUNTIME_OK\\n";
          `;
          const b={
            $schema:canonical.$schema,
            landingPage:'/',
            preferredVersions:canonical.preferredVersions,
            features:canonical.features,
            steps:[
              config,
              {step:'mkdir',path:'/wordpress/wp-content/plugins/quantdeus-core'},
              {step:'writeFile',path:'/wordpress/wp-content/plugins/quantdeus-core/quantdeus-core.php',data:source('wordpress/src/quantdeus-core/quantdeus-core.php')},
              {step:'mkdir',path:'/wordpress/wp-content/themes/quantdeus-aero'},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/style.css',data:source('wordpress/src/quantdeus-aero/style.css')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/functions.php',data:source('wordpress/src/quantdeus-aero/functions.php')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/front-page.php',data:source('wordpress/src/quantdeus-aero/front-page.php')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/header.php',data:source('wordpress/src/quantdeus-aero/header.php')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/footer.php',data:source('wordpress/src/quantdeus-aero/footer.php')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/page-login.php',data:source('wordpress/src/quantdeus-aero/page-login.php')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/index.php',data:source('wordpress/src/quantdeus-aero/index.php')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/app.js',data:source('wordpress/src/quantdeus-aero/app.js')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/theme.json',data:source('wordpress/src/quantdeus-aero/theme.json')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/archive-qd_forum_thread.php',data:source('wordpress/src/quantdeus-aero/archive-qd_forum_thread.php')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/single-qd_forum_thread.php',data:source('wordpress/src/quantdeus-aero/single-qd_forum_thread.php')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/archive.php',data:source('wordpress/src/quantdeus-aero/archive.php')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/single.php',data:source('wordpress/src/quantdeus-aero/single.php')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/page.php',data:source('wordpress/src/quantdeus-aero/page.php')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/page-federation.php',data:source('wordpress/src/quantdeus-aero/page-federation.php')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/page-horizons.php',data:source('wordpress/src/quantdeus-aero/page-horizons.php')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/page-ai-fleet.php',data:source('wordpress/src/quantdeus-aero/page-ai-fleet.php')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/page-manifesto.php',data:source('wordpress/src/quantdeus-aero/page-manifesto.php')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/page-community.php',data:source('wordpress/src/quantdeus-aero/page-community.php')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/page-knowledge.php',data:source('wordpress/src/quantdeus-aero/page-knowledge.php')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/page-ksenia-cherednikova.php',data:source('wordpress/src/quantdeus-aero/page-ksenia-cherednikova.php')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/page-media.php',data:source('wordpress/src/quantdeus-aero/page-media.php')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/page-news.php',data:source('wordpress/src/quantdeus-aero/page-news.php')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/page-about.php',data:source('wordpress/src/quantdeus-aero/page-about.php')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/page-account.php',data:source('wordpress/src/quantdeus-aero/page-account.php')},
              {step:'activatePlugin',pluginPath:'quantdeus-core/quantdeus-core.php',pluginName:'QuantDeus Core'},
              {step:'activateTheme',themeFolderName:'quantdeus-aero'},
              options,seed,{step:'runPHP',code:assertion}
            ].filter(Boolean)
          };
          fs.writeFileSync('/tmp/quantdeus-wordpress-blueprint.json',JSON.stringify(b));
          NODE
