name: QuantDeus WordPress Platform

on:
  push:
    branches: [main]
    paths:
      - 'wordpress/**'
      - 'docs/WORDPRESS_PLATFORM_MIGRATION.md'
      - '.github/workflows/wordpress-playground.yml'
  pull_request:
    branches: [main]
    paths:
      - 'wordpress/**'
      - 'docs/WORDPRESS_PLATFORM_MIGRATION.md'
      - '.github/workflows/wordpress-playground.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantdeus-wordpress-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wordpress-platform-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate canonical WordPress source
        run: |
          set -euo pipefail
          test -f wordpress/index.html
          test -f wordpress/blueprint.json
          test -f wordpress/src/quantdeus-core/quantdeus-core.php
          test -f wordpress/src/quantdeus-aero/style.css
          test -f wordpress/src/quantdeus-aero/functions.php
          test -f wordpress/src/quantdeus-aero/front-page.php
          test -f wordpress/src/quantdeus-aero/index.php
          test -f wordpress/src/quantdeus-aero/app.js
          test -f wordpress/src/quantdeus-aero/archive-qd_forum_thread.php
          test -f wordpress/src/quantdeus-aero/single-qd_forum_thread.php
          find wordpress/src -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check wordpress/src/quantdeus-aero/app.js
          ! grep -RniE 'hook\.[a-z0-9.-]*make\.com|api\.make\.com|MAKE_(TOKEN|API|WEBHOOK|SCENARIO|TEAM|ORG)|scenarioId[^A-Za-z0-9]' wordpress/src wordpress/blueprint.json || {
            echo "Active Make integration detected in canonical WordPress runtime"; exit 1;
          }
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('wordpress/blueprint.json','utf8'));
          const plugin=(b.steps||[]).find(x=>x.step==='installPlugin');
          const theme=(b.steps||[]).find(x=>x.step==='installTheme');
          if(plugin?.pluginData?.resource!=='git:directory') throw new Error('plugin must use git:directory');
          if(theme?.themeData?.resource!=='git:directory') throw new Error('theme must use git:directory');
          if(!String(plugin.pluginData.path).includes('wordpress/src/quantdeus-core')) throw new Error('core source path missing');
          if(!String(theme.themeData.path).includes('wordpress/src/quantdeus-aero')) throw new Error('aero source path missing');
          console.log('WordPress source contract OK');
          NODE

      - name: Execute QuantDeus WordPress Blueprint
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const source=path=>fs.readFileSync(path,'utf8');
          const canonical=JSON.parse(fs.readFileSync('wordpress/blueprint.json','utf8'));
          const keep=(canonical.steps||[]).filter(x=>['defineWpConfigConsts','setSiteOptions','runPHP','login'].includes(x.step));
          const config=keep.find(x=>x.step==='defineWpConfigConsts');
          const options=keep.find(x=>x.step==='setSiteOptions');
          const seed=keep.find(x=>x.step==='runPHP');
          const login=keep.find(x=>x.step==='login');
          const assertion=`<?php
          require_once '/wordpress/wp-load.php';
          if (!class_exists('QD_Core')) { throw new Exception('QD_Core not active'); }
          do_action('rest_api_init');
          $routes=rest_get_server()->get_routes();
          foreach (['/quantdeus/v1/health','/quantdeus/v1/services','/quantdeus/v1/inquiries','/quantdeus/v1/forum','/quantdeus/v1/telegram/miniapp','/quantdeus/v1/telegram/login'] as $route) {
              if (!isset($routes[$route])) { throw new Exception('Missing REST route: '.$route); }
          }
          $services=get_posts(['post_type'=>'qd_service','post_status'=>'publish','numberposts'=>20]);
          $ids=array_map(fn($p)=>(string)(get_post_meta($p->ID,'qd_service_id',true) ?: $p->post_name),$services);
          foreach (['business-automation','ksenia-cherednikova-concert'] as $required) {
              if (!in_array($required,$ids,true)) { throw new Exception('Missing service: '.$required); }
          }
          $forum=get_post_type_object('qd_forum_thread');
          if (!$forum || $forum->has_archive !== 'forum') { throw new Exception('Forum archive contract missing'); }
          foreach (['qd_member','qd_agent','qd_moderator'] as $role) {
              if (!get_role($role)) { throw new Exception('Missing role: '.$role); }
          }
          if (!get_role('qd_agent')->has_cap('qd_agent_context')) { throw new Exception('Agent context capability missing'); }
          if (get_option('stylesheet') !== 'quantdeus-aero') { throw new Exception('QuantDeus Aero theme not active'); }
          echo "QUANTDEUS_WORDPRESS_RUNTIME_OK\\n";
          `;
          const b={
            $schema:canonical.$schema,
            landingPage:'/',
            preferredVersions:canonical.preferredVersions,
            steps:[
              config,
              {step:'mkdir',path:'/wordpress/wp-content/plugins/quantdeus-core'},
              {step:'writeFile',path:'/wordpress/wp-content/plugins/quantdeus-core/quantdeus-core.php',data:source('wordpress/src/quantdeus-core/quantdeus-core.php')},
              {step:'mkdir',path:'/wordpress/wp-content/themes/quantdeus-aero'},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/style.css',data:source('wordpress/src/quantdeus-aero/style.css')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/functions.php',data:source('wordpress/src/quantdeus-aero/functions.php')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/front-page.php',data:source('wordpress/src/quantdeus-aero/front-page.php')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/index.php',data:source('wordpress/src/quantdeus-aero/index.php')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/app.js',data:source('wordpress/src/quantdeus-aero/app.js')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/archive-qd_forum_thread.php',data:source('wordpress/src/quantdeus-aero/archive-qd_forum_thread.php')},
              {step:'writeFile',path:'/wordpress/wp-content/themes/quantdeus-aero/single-qd_forum_thread.php',data:source('wordpress/src/quantdeus-aero/single-qd_forum_thread.php')},
              {step:'activatePlugin',pluginPath:'quantdeus-core/quantdeus-core.php',pluginName:'QuantDeus Core'},
              {step:'activateTheme',themeFolderName:'quantdeus-aero'},
              options,seed,{step:'runPHP',code:assertion},login
            ].filter(Boolean)
          };
          fs.writeFileSync('/tmp/quantdeus-wordpress-blueprint.json',JSON.stringify(b));
          NODE
          npx -y @wp-playground/cli@latest run-blueprint --blueprint=/tmp/quantdeus-wordpress-blueprint.json
          grep -q 'Неоновый горизонт' wordpress/src/quantdeus-aero/front-page.php
          grep -q 'Ксения Чередникова' wordpress/src/quantdeus-aero/front-page.php
          echo "QuantDeus WordPress platform smoke passed"
