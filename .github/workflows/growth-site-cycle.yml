name: QuantDeus Growth + Site Cycle 📣🌐

on:
  schedule:
    - cron: '53 */4 * * *'
  workflow_dispatch:
    inputs:
      agent_id:
        description: Optional one of unity,synthesis,archivist,herald,tasksmith,control-tower
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  checks: read
  id-token: write

concurrency:
  group: quantdeus-growth-site-cycle-${{ inputs.agent_id || github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  growth-site:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate shared QuantDeus mission
        run: node scripts/mission-alignment.js
      - name: Run rotating growth/site specialist
        id: cycle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_AGENT_ID: ${{ inputs.agent_id }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const office=require('./scripts/openclaw-office-client');
          const registry=JSON.parse(fs.readFileSync('coordination/agents.json','utf8'));
          const byId=new Map(registry.agents.map(a=>[a.id,a]));
          const rotation={0:'unity',4:'synthesis',8:'archivist',12:'herald',16:'tasksmith',20:'control-tower'};
          const allowed=new Set(Object.values(rotation));
          const manual=String(process.env.INPUT_AGENT_ID||'').trim();
          const now=new Date();
          const hour=now.getUTCHours();
          const minute=now.getUTCMinutes();
          const slots=Object.keys(rotation).map(Number).sort((a,b)=>a-b);
          const nowMinutes=hour*60+minute;
          const dueSlots=slots.filter(h=>h*60+53<=nowMinutes);
          const scheduledHour=dueSlots.length?dueSlots[dueSlots.length-1]:slots[slots.length-1];
          const requestedAgentId=manual||rotation[scheduledHour];
          if(manual && !allowed.has(requestedAgentId)) throw new Error('Invalid growth/site agent');
          if(!requestedAgentId || !allowed.has(requestedAgentId)){
            console.log(JSON.stringify({ok:true,action:'none',reason:'no valid growth/site slot',hour_utc:hour,minute_utc:minute}));
            process.exit(0);
          }
          const requestedAgent=byId.get(requestedAgentId);
          const delegatedFrom=requestedAgent?.operational_status==='medbay' ? requestedAgentId : null;
          const agentId=delegatedFrom ? String(requestedAgent?.temporary_delegate||'') : requestedAgentId;
          if(!agentId || !allowed.has(agentId) || !byId.has(agentId)) throw new Error('Invalid medbay delegate for '+requestedAgentId);
          const agent=byId.get(agentId);
          function parse(text){
            const raw=String(text||'').trim();
            try{return JSON.parse(raw)}catch{}
            const m=raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
            if(m)return JSON.parse(m[1].trim());
            throw new Error('Growth/site response must be strict JSON');
          }
          (async()=>{
            const result=await office.ask({
              profile:agentId,
              trusted:true,
              messages:[{role:'user',content:[
                'QuantDeus growth + site autonomous cycle.',
                'Requested slot: '+requestedAgentId+'. Active profile: '+agentId+' — '+agent.role,
                delegatedFrom ? 'EMH medbay delegation: '+delegatedFrom+' is temporarily inactive; preserve its requested mission while using the active delegate profile.' : '',
                'Read coordination/manifesto-living.md, coordination/growth/marketing-operating-system.md, coordination/growth/marketing-stack.json, coordination/growth/marketing-scorecard.json, coordination/growth/platform-playbook.json, contributor recruitment contract, open Issues/PRs and the current public site.',
                'Use Playwright to inspect https://quantdeus.github.io/ and relevant routes when site work is appropriate.',
                'Keep evidence collection bounded: prefer the checked-out workspace for repository files and use at most two fresh GitHub read queries before deciding the action. Do not refetch workspace files through GitHub MCP.',
                '',
                'Goal: improve truthful discovery, qualified demand and measurable movement through ATTRACT → CAPTURE → NURTURE → CONVERT → RETAIN → REFER.',
                'Use your profile-scoped marketing skills. Every proposed artifact/campaign must name audience, funnel stage, CTA, hypothesis and primary metric. Generated copy alone is not success.',
                'Synthesis may run the content factory from one verified source into platform-native derivatives. Archivist may build programmatic SEO only when every indexed page has distinct user intent and substantive unique value; classic doorway pages, thin city/keyword permutations and scaled low-value content are forbidden.',
                'Herald may design permission-based nurture/follow-up and distribution. Unity owns funnel architecture, segmentation and growth experiments. Use coordination/growth/marketing-scorecard.json only for VERIFIED aggregate outcomes; unknown metrics stay unknown.',
                'For multi-platform promotion, prepare platform-native packages tied to real artifacts. Automatic third-party posting is allowed only when a specific authorized connector/account path exists; otherwise create/update a public-safe campaign artifact or Issue for later publication.',
                'Never mass-DM strangers, fake likes/followers/contributors, impersonate people, scrape private contacts, or manufacture engagement. Doorway/low-value scaled SEO is prohibited; prefer useful programmatic landing pages with unique intent/value or noindex/consolidation.',
                'Political/civic topics must remain neutral/informational and must not be used for voter targeting, party/candidate promotion or outrage bait.',
                '',
                'You may create at most one branch+PR or one Issue. Site/content PR branch must start automation/site-refresh/.',
                'Mark autopublish=true ONLY if every changed file is public site/content/SEO/growth documentation and the change is safe to publish after independent QA + Static Smoke. Code, workflows, security, payments, auth, governance, doctrine-core or integrations must use autopublish=false.',
                'Verify any mutation exists.',
                '',
                'Return ONLY strict JSON:',
                '{"action":"none","reason":"..."}',
                'or {"action":"issue","issue_number":123,"summary":"..."}',
                'or {"action":"pr","pr_number":123,"branch":"automation/site-refresh/...","autopublish":true,"summary":"..."}'
              ].join('\n')}],
              metadata:{source:'quantdeus-growth-site-cycle',repository:process.env.GITHUB_REPOSITORY,agent_id:agentId,requested_agent_id:requestedAgentId,delegated_from:delegatedFrom||'',hour_utc:hour,scheduled_hour_utc:scheduledHour}
            });
            if(result.runtime!=='openclaw-agent-exec-trusted-tools') throw new Error('Growth/site cycle lacks trusted tools');
            const d=parse(result.text);
            if(!['none','issue','pr'].includes(d.action)) throw new Error('Unsupported growth/site action');
            if(d.action==='pr'){
              if(!String(d.branch||'').startsWith('automation/site-refresh/')) throw new Error('Site PR outside allowed prefix');
              fs.appendFileSync(process.env.GITHUB_OUTPUT,'pr_number='+Number(d.pr_number)+'\n');
              fs.appendFileSync(process.env.GITHUB_OUTPUT,'branch='+String(d.branch)+'\n');
              fs.appendFileSync(process.env.GITHUB_OUTPUT,'autopublish='+(d.autopublish===true?'true':'false')+'\n');
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'action='+d.action+'\n');
            console.log(JSON.stringify({requested_agent:requestedAgentId,active_agent:agentId,delegated_from:delegatedFrom,model:result.model,decision:d},null,2));
          })().catch(e=>{
            if(office.isTransientError(e)){
              const decision={action:'none',degraded:true,reason:'TRANSIENT_OPENCLAW: '+String(e.message||e).slice(0,500)};
              fs.appendFileSync(process.env.GITHUB_OUTPUT,'action=none\n');
              fs.appendFileSync(process.env.GITHUB_OUTPUT,'degraded=true\n');
              console.error('Growth/site cycle degraded by transient OpenClaw failure; leaving repository unchanged and failing the run so green means healthy.');
              console.log(JSON.stringify({agent:agentId,decision},null,2));
              process.exitCode=2;
              return;
            }
            console.error(e.stack||e);
            process.exit(1);
          });
          NODE
      - name: Guarded auto-publish safe site/content PR
        if: steps.cycle.outputs.action == 'pr' && steps.cycle.outputs.autopublish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cycle.outputs.pr_number }}
          AUTO_MERGE_MODE: site
          EXPECTED_BRANCH_PREFIX: automation/site-refresh/
        run: node scripts/guarded-automerge.js
