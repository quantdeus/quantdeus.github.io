name: QuantDeus Telegram Federation Contract
run-name: "Проверка связи Telegram с Федерацией"

on:
  pull_request:
    paths:
      - 'coordination/telegram-federation.json'
      - 'vercel-dispatcher/lib/telegram-federation.js'
      - 'vercel-dispatcher/lib/telegram-direct-llm.js'
      - 'scripts/telegram-webhook-setup.js'
      - 'scripts/qa/telegram-bot-routing.mjs'
      - 'vercel-dispatcher/api/quantdeus/telegram.js'
      - 'scripts/qa/telegram-federation-contract.js'
      - '.github/workflows/telegram-federation-contract.yml'
  push:
    branches: [main]
    paths:
      - 'coordination/telegram-federation.json'
      - 'vercel-dispatcher/lib/telegram-federation.js'
      - 'vercel-dispatcher/lib/telegram-direct-llm.js'
      - 'scripts/telegram-webhook-setup.js'
      - 'scripts/qa/telegram-bot-routing.mjs'
      - 'vercel-dispatcher/api/quantdeus/telegram.js'
      - 'scripts/qa/telegram-federation-contract.js'
      - '.github/workflows/telegram-federation-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Проверить код Telegram
        run: |
          node --check vercel-dispatcher/api/quantdeus/telegram.js
          node --check vercel-dispatcher/lib/telegram-direct-llm.js
          node --check scripts/telegram-webhook-setup.js
      - name: Проверить связь Telegram с Федерацией
        run: node scripts/qa/telegram-federation-contract.js
      - name: Проверить независимые боты и резервный LLM
        run: node scripts/qa/telegram-bot-routing.mjs
