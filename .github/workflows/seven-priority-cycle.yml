name: QuantDeus Seven Priority Cycle 🖖

on:
  schedule:
    - cron: '11 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seven-priority-cycle.yml'
      - 'scripts/openclaw-office-client.js'

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  checks: read
  id-token: write

concurrency:
  group: quantdeus-seven-priority-cycle
  cancel-in-progress: false

jobs:
  seven:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate shared QuantDeus mission
        run: node scripts/mission-alignment.js
      - name: Capture public community and execution state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/qd-seven
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title,body,labels,updatedAt,author,url > /tmp/qd-seven/issues.json
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 40 --json number,title,headRefName,updatedAt,author,url,statusCheckRollup > /tmp/qd-seven/prs.json
          gh run list --repo "$GITHUB_REPOSITORY" --limit 40 --json databaseId,workflowName,status,conclusion,createdAt,headSha,url > /tmp/qd-seven/actions.json
          gh api "repos/$GITHUB_REPOSITORY/contributors?per_page=30" > /tmp/qd-seven/contributors.json
      - name: Let Seven choose one priority action
        id: seven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const office=require('./scripts/openclaw-office-client');
          const read=p=>{try{return fs.readFileSync(p,'utf8').slice(0,40000)}catch{return ''}};
          const readJson=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          function parse(text){
            const raw=String(text||'').trim();
            try{return JSON.parse(raw)}catch{}
            const m=raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
            if(m)return JSON.parse(m[1].trim());
            throw new Error('Seven decision must be strict JSON');
          }
          (async()=>{
            const result=await office.ask({
              profile:'seven-of-nine',
              trusted:true,
              messages:[{role:'user',content:[
                'Seven of Nine priority cycle for QuantDeus.',
                'Before acting, read the canonical doctrine, the living manifesto, agent cron map, contributor-growth contract and fresh main.',
                'Use this public execution/community snapshot:',
                'ISSUES='+read('/tmp/qd-seven/issues.json'),
                'PRS='+read('/tmp/qd-seven/prs.json'),
                'ACTIONS='+read('/tmp/qd-seven/actions.json'),
                'CONTRIBUTORS='+read('/tmp/qd-seven/contributors.json'),
                '',
                'Priority order: (1) broken production/Actions/security, (2) unfinished coord:active/coord:ready work with a concrete owner, (3) blocked human contributors and community needs, (4) active manifesto commitments and measured outcomes, (5) stale/high-value PRs or execution gaps, (6) growth/site opportunities backed by real artifacts.',
                'Act as the coordinator, not as another implementer: before opening new work, inspect unfinished coord:active/coord:ready Issues and their body/labels. If an actionable Issue has a quantdeus-target-agent marker or agent:<id> label and no open implementation PR, prefer dispatching agent-role-cron.yml with inputs.agent_id=<id> to wake that homunculus.',
                'Do not repeatedly ping the same task when an implementation PR already exists, the Issue is blocked, or a recent agent action already addresses it.',
                'Choose at most ONE action. You may update one existing Issue or create one branch+PR via GitHub MCP. PR branch must start automation/seven/.',
                'For a NEW Issue, do NOT call create_issue through MCP. Return action=open_issue with a bounded proposal; the workflow will validate, deduplicate, create and verify it deterministically with GITHUB_TOKEN.',
                'Alternatively request ONE safe workflow dispatch from this allowlist: qa-triad.yml, static-smoke.yml, qa-self-heal.yml, contributor-growth.yml, quantdeus-pulse.yml, agent-role-cron.yml, news-manifest-cycle.yml, growth-site-cycle.yml, openclaw-evolution.yml.',
                'Do not merge PRs, weaken guardrails, expose secrets, spend money, mass-message people or manufacture urgency/community activity.',
                'Political/civic signals can affect neutral research and operational risk analysis but never become party/candidate endorsement, voter targeting or persuasion.',
                '',
                'Return ONLY strict JSON:',
                '{"action":"none","reason":"..."}',
                'or {"action":"dispatch","workflow":"qa-triad.yml","inputs":{},"reason":"..."}',
                'or {"action":"open_issue","issue":{"title":"...","body":"Goal...\\n\\nAcceptance criteria...","labels":["coord:task","coord:ready"],"target_agent":"tasksmith"},"reason":"..."}',
                'or {"action":"issue","issue_number":123,"reason":"..."}',
                'or {"action":"pr","pr_number":123,"branch":"automation/seven/...","reason":"..."}'
              ].join('\n')}],
              metadata:{source:'quantdeus-seven-priority-cycle',repository:process.env.GITHUB_REPOSITORY}
            });
            if(result.runtime!=='openclaw-agent-exec-trusted-tools') throw new Error('Seven cycle lacks trusted OpenClaw tools');
            const d=parse(result.text);
            if(!['none','dispatch','open_issue','issue','pr'].includes(d.action)) throw new Error('Unsupported Seven action');
            if(d.action==='pr'&&!String(d.branch||'').startsWith('automation/seven/')) throw new Error('Seven PR outside automation/seven/*');
            if(d.action==='dispatch'){
              fs.appendFileSync(process.env.GITHUB_OUTPUT,'workflow='+String(d.workflow||'')+'\n');
              fs.appendFileSync(process.env.GITHUB_OUTPUT,'inputs='+Buffer.from(JSON.stringify(d.inputs||{})).toString('base64')+'\n');
            }
            if(d.action==='open_issue'){
              const issue=d.issue||{};
              const proposal={
                title:String(issue.title||'').trim(),
                body:String(issue.body||'').trim(),
                labels:Array.isArray(issue.labels)?issue.labels.map(String):[],
                target_agent:String(issue.target_agent||'').trim()
              };
              if(proposal.title.length<8 || proposal.title.length>120) throw new Error('Seven open_issue title outside 8..120 chars');
              if(proposal.body.length<30 || proposal.body.length>20000) throw new Error('Seven open_issue body outside 30..20000 chars');
              fs.appendFileSync(process.env.GITHUB_OUTPUT,'issue_proposal='+Buffer.from(JSON.stringify(proposal)).toString('base64')+'\n');
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'action='+d.action+'\n');
            console.log(JSON.stringify({model:result.model,decision:d},null,2));
          })().catch(e=>{
            if(office.isTransientError(e)){
              console.warn('Seven OpenClaw decision degraded; selecting one deterministic safe role dispatch.');
              // The prompt snapshot is intentionally truncated, but deterministic
              // recovery must use the complete machine-generated JSON.
              const issues=readJson('/tmp/qd-seven/issues.json');
              const prs=readJson('/tmp/qd-seven/prs.json');
              const registry=require('./coordination/agents.json');
              const known=new Set((registry.agents||[]).map(x=>String(x.id||'').trim()).filter(Boolean));
              const labelsOf=i=>new Set((i.labels||[]).map(x=>typeof x==='string'?x:x.name));
              const targetOf=i=>{
                const labels=labelsOf(i);
                const byLabel=[...labels].find(x=>x.startsWith('agent:'))?.slice(6);
                const byMarker=String(i.body||'').match(/quantdeus-target-agent:([a-z0-9-]+)/i)?.[1];
                const target=String(byLabel||byMarker||'').trim();
                return known.has(target)?target:'';
              };
              const represented=i=>prs.some(pr=>{
                const hay=[pr.title,pr.body,pr.headRefName].filter(Boolean).join('\n');
                return new RegExp(`(?:#|issue[-_/ ])${i.number}(?:\\b|$)`,'i').test(hay);
              });
              const candidates=issues.filter(i=>{
                const labels=labelsOf(i);
                return labels.has('coord:task') &&
                  (labels.has('coord:active')||labels.has('coord:ready')) &&
                  !labels.has('coord:blocked') &&
                  !labels.has('squad-b:blocked') &&
                  !labels.has('squad-b:review') &&
                  !represented(i) &&
                  Boolean(targetOf(i));
              }).sort((a,b)=>{
                const la=labelsOf(a),lb=labelsOf(b);
                const score=l=>(l.has('coord:active')?0:10)+(l.has('priority:p0')?0:l.has('priority:p1')?1:2);
                return score(la)-score(lb)||String(a.updatedAt||'').localeCompare(String(b.updatedAt||''))||a.number-b.number;
              });
              const candidate=candidates[0];
              if(candidate){
                const inputs={agent_id:targetOf(candidate),issue_number:String(candidate.number)};
                fs.appendFileSync(process.env.GITHUB_OUTPUT,'workflow=agent-role-cron.yml\n');
                fs.appendFileSync(process.env.GITHUB_OUTPUT,'inputs='+Buffer.from(JSON.stringify(inputs)).toString('base64')+'\n');
                fs.appendFileSync(process.env.GITHUB_OUTPUT,'action=dispatch\n');
                console.log(JSON.stringify({degraded:true,fallback:'deterministic',workflow:'agent-role-cron.yml',inputs,reason:String(e.message||e).slice(0,500)},null,2));
                return;
              }
              fs.appendFileSync(process.env.GITHUB_OUTPUT,'action=none\n');
              console.warn('No deterministic safe role candidate found after transient OpenClaw failure.');
              return;
            }
            console.error(e.stack||e);
            process.exit(1);
          });
          NODE
      - name: Publish Seven-proposed Issue deterministically
        if: steps.seven.outputs.action == 'open_issue'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_PROPOSAL_B64: ${{ steps.seven.outputs.issue_proposal }}
          ISSUE_SOURCE_AGENT: seven-of-nine
          ISSUE_SOURCE_WORKFLOW: seven-priority-cycle.yml
        run: node scripts/publish-agent-issue.js

      - name: Dispatch Seven-selected safe workflow
        if: steps.seven.outputs.action == 'dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW: ${{ steps.seven.outputs.workflow }}
          INPUTS_B64: ${{ steps.seven.outputs.inputs }}
        run: |
          node <<'NODE'
          const {execFileSync}=require('child_process');
          const allowed=new Set(['qa-triad.yml','static-smoke.yml','qa-self-heal.yml','contributor-growth.yml','quantdeus-pulse.yml','agent-role-cron.yml','news-manifest-cycle.yml','growth-site-cycle.yml','openclaw-evolution.yml']);
          const workflow=String(process.env.WORKFLOW||'');
          if(!allowed.has(workflow)) throw new Error('Workflow not in Seven dispatch allowlist');
          const inputs=JSON.parse(Buffer.from(process.env.INPUTS_B64||'e30=','base64').toString('utf8'));
          const args=['workflow','run',workflow,'--repo',process.env.GITHUB_REPOSITORY,'--ref','main'];
          for(const [k,v] of Object.entries(inputs)){
            if(workflow==='qa-self-heal.yml' && k==='lane' && ['full','site','actions'].includes(String(v))) args.push('-f',k+'='+v);
            else if(workflow==='agent-role-cron.yml' && k==='agent_id' && /^[a-z0-9-]+$/.test(String(v))) args.push('-f',k+'='+v);
            else if(workflow==='agent-role-cron.yml' && k==='issue_number' && /^\\d+$/.test(String(v))) args.push('-f',k+'='+v);
            else if(Object.keys(inputs).length) throw new Error('Unsupported workflow input');
          }
          execFileSync('gh',args,{stdio:'inherit',env:{...process.env,GH_TOKEN:process.env.GH_TOKEN}});
          NODE
