name: Prisma Fallback Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - infra/prisma-fallback
    paths:
      - 'prisma-fallback/**'
      - 'coordination/agents.json'
      - '.github/workflows/prisma-fallback-deploy.yml'

concurrency:
  group: prisma-fallback-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/infra/prisma-fallback'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2

      - name: Install and typecheck fallback
        working-directory: prisma-fallback
        run: |
          bun install
          bun run typecheck

      - name: Deploy QuantDeus fallback to Prisma Compute
        id: prisma-deploy
        uses: prisma/cloud-deploy-action@v1
        with:
          working-directory: prisma-fallback
          module: module.ts
          build-command: bun run build

      - name: Require a real Prisma deployment
        env:
          PRISMA_DEPLOY_OUTCOME: ${{ steps.prisma-deploy.outputs.outcome }}
          PRISMA_DEPLOY_URL: ${{ steps.prisma-deploy.outputs.url }}
        run: |
          set -euo pipefail
          echo "Prisma deploy outcome: ${PRISMA_DEPLOY_OUTCOME:-missing}"
          if [ "${PRISMA_DEPLOY_OUTCOME:-}" != "succeeded" ]; then
            echo "::error::Prisma fallback was not deployed (outcome=${PRISMA_DEPLOY_OUTCOME:-missing})."
            exit 1
          fi
          if [ -z "${PRISMA_DEPLOY_URL:-}" ]; then
            echo "::error::Prisma deploy reported success but did not return a public URL."
            exit 1
          fi
          echo "Prisma fallback URL: $PRISMA_DEPLOY_URL"
