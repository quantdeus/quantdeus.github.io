name: QuantDeus OpenClaw Admin Office Smoke
# production re-smoke after tool-roundtrip gate c041dbe

# Updating this workflow intentionally retriggers the live trusted-office smoke after a runtime mirror sync.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/openclaw-admin-smoke.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  checks: read
  id-token: write

# production re-smoke after bounded MCP deploy cc83cb2
concurrency:
  group: qd-openclaw-admin-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify trusted OpenClaw GitHub MCP lane
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const office = require('./scripts/openclaw-office-client');
          (async () => {
            const result = await office.ask({
              profile: 'seven-of-nine',
              trusted: true,
              messages: [{
                role: 'user',
                content: 'Read-only smoke. Use only github__list_branches, exactly once, for quantdeus/quantdeus.github.io. Do not call any other tool, do not call Playwright, and do not mutate GitHub. Confirm main exists, then reply exactly OPENCLAW_GITHUB_MCP_OK.'
              }],
              metadata: { source: 'openclaw-admin-smoke', phase: 'github', repository: process.env.GITHUB_REPOSITORY }
            });
            if (result.text.trim() !== 'OPENCLAW_GITHUB_MCP_OK') throw new Error('Unexpected GitHub MCP smoke response: ' + result.text.slice(0, 800));
            if (result.runtime !== 'openclaw-agent-exec-trusted-tools') throw new Error('Unexpected runtime: ' + result.runtime);
            console.log(JSON.stringify({ ok: true, runtime: result.runtime, model: result.model, smoke: result.text }));
          })().catch(error => { console.error(error.message || error); process.exit(1); });
          NODE

      - name: Verify trusted OpenClaw Playwright MCP lane
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const office = require('./scripts/openclaw-office-client');
          (async () => {
            const result = await office.ask({
              profile: 'seven-of-nine',
              trusted: true,
              messages: [{
                role: 'user',
                content: 'Read-only browser smoke. Use only playwright__browser_navigate and playwright__browser_snapshot. Do not call GitHub. Call playwright__browser_navigate exactly once with https://example.com and then playwright__browser_snapshot exactly once. Do not use evaluate, run-code, or any other tools. Confirm Example Domain is visible, then reply exactly OPENCLAW_PLAYWRIGHT_MCP_OK.'
              }],
              metadata: { source: 'openclaw-admin-smoke', phase: 'playwright', repository: process.env.GITHUB_REPOSITORY }
            });
            if (result.text.trim() !== 'OPENCLAW_PLAYWRIGHT_MCP_OK') throw new Error('Unexpected Playwright MCP smoke response: ' + result.text.slice(0, 800));
            if (result.runtime !== 'openclaw-agent-exec-trusted-tools') throw new Error('Unexpected runtime: ' + result.runtime);
            console.log(JSON.stringify({ ok: true, runtime: result.runtime, model: result.model, smoke: result.text }));
          })().catch(error => { console.error(error.message || error); process.exit(1); });
          NODE

      - name: Record successful live MCP smoke
        run: |
          mkdir -p coordination/tests
          cat > coordination/tests/openclaw-admin-live-smoke-latest.md <<EOF
          # OpenClaw Admin Office live MCP smoke

          - commit: ${GITHUB_SHA}
          - run: ${GITHUB_RUN_ID}
          - verified_at_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - GitHub MCP: OPENCLAW_GITHUB_MCP_OK
          - Playwright MCP: OPENCLAW_PLAYWRIGHT_MCP_OK
          - production endpoint: https://quantdeus.vercel.app/api/quantdeus/openclaw
          EOF
          git config user.name "quantdeus-smoke[bot]"
          git config user.email "quantdeus-smoke[bot]@users.noreply.github.com"
          git add coordination/tests/openclaw-admin-live-smoke-latest.md
          if git diff --cached --quiet; then
            echo "Smoke evidence unchanged."
          else
            git commit -m "test(openclaw): record live MCP smoke pass"
            git push
          fi
