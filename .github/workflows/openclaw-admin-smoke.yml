name: QuantDeus OpenClaw Admin Office Smoke
# production re-smoke after direct MCP schemas 16e6f1f
# production re-smoke after hardened MCP runtime 84c6ffe
# production re-smoke after Playwright MCP Chrome install dbfe582
# production re-smoke after sequential two-tool model gate
# production re-smoke after validated provider fallbacks

# Updating this workflow intentionally retriggers the live trusted-office smoke after a runtime mirror sync.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/openclaw-admin-smoke.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  checks: read
  id-token: write

# production re-smoke after bounded MCP deploy cc83cb2
concurrency:
  group: qd-openclaw-admin-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify trusted OpenClaw GitHub MCP lane
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const office = require('./scripts/openclaw-office-client');
          (async () => {
            const passes = [];
            for (let attempt = 1; attempt <= 2; attempt += 1) {
              const result = await office.ask({
                profile: 'seven-of-nine',
                trusted: true,
                messages: [{
                  role: 'user',
                  content: 'Read-only regression smoke. Use only github__get_file_contents, exactly once, to read README.md from owner quantdeus and repo quantdeus.github.io on main. Do not call any other tool, do not call Playwright, and do not mutate GitHub. After the tool returns, reply exactly OPENCLAW_GITHUB_MCP_OK.'
                }],
                metadata: { source: 'openclaw-admin-smoke', phase: 'github', repository: process.env.GITHUB_REPOSITORY, regression_attempt: attempt }
              });
              if (result.runtime !== 'openclaw-agent-exec-trusted-tools') throw new Error('Unexpected runtime: ' + result.runtime);
              const summary = result.raw?.tool_summary;
              if (!summary || !Array.isArray(summary.tools) || !summary.tools.includes('github__get_file_contents') || Number(summary.failures || 0) !== 0) {
                throw new Error('GitHub MCP regression trace missing/failed on pass ' + attempt + ': ' + JSON.stringify(summary));
              }
              if (String(result.text || '').trim() !== 'OPENCLAW_GITHUB_MCP_OK') {
                throw new Error('GitHub MCP regression final response mismatch on pass ' + attempt + ': ' + String(result.text || '').slice(0, 300));
              }
              passes.push({ attempt, model: result.model, tool_summary: summary });
            }
            const branch = await fetch('https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/branches/main', {
              headers: {
                authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
                accept: 'application/vnd.github+json',
                'x-github-api-version': '2022-11-28'
              }
            });
            if (!branch.ok) throw new Error('Direct GitHub branch verification failed: ' + branch.status + ' ' + (await branch.text()).slice(0, 500));
            console.log(JSON.stringify({ ok: true, consecutive_github_mcp_passes: passes.length, passes }));
          })().catch(error => { console.error(error.message || error); process.exit(1); });
          NODE

      - name: Verify brokered-read OpenClaw publicrepo MCP lane
        run: |
          node <<'NODE'
          const office = require('./scripts/openclaw-office-client');
          (async () => {
            // Deliberately do not provide GITHUB_TOKEN/GH_TOKEN: this smoke must prove
            // the credentialless publicrepo MCP lane, not the trusted GitHub MCP lane.
            delete process.env.GITHUB_TOKEN;
            delete process.env.GH_TOKEN;
            const result = await office.ask({
              profile: 'seven-of-nine',
              trusted: false,
              messages: [{
                role: 'user',
                content: 'Repository evidence regression smoke. Call publicrepo__get_file exactly once with path README.md. Do not request changes. After the read returns, reply exactly OPENCLAW_BROKERED_READ_MCP_OK.'
              }],
              metadata: { source: 'openclaw-admin-smoke', phase: 'brokered-read', repository: process.env.GITHUB_REPOSITORY }
            });
            if (result.runtime !== 'openclaw-agent-exec-brokered-read-tools') throw new Error('Unexpected brokered runtime: ' + result.runtime);
            const capabilities = result.raw?.tools || {};
            if (
              capabilities.public_repo_mcp !== true ||
              capabilities.github_write !== false ||
              capabilities.filesystem !== false ||
              capabilities.playwright_mcp !== false ||
              capabilities.shell !== false
            ) {
              throw new Error('Brokered capability boundary mismatch: ' + JSON.stringify(capabilities));
            }
            const summary = result.raw?.tool_summary;
            if (!summary || !Array.isArray(summary.tools) || summary.tools.length !== 1 || summary.tools[0] !== 'publicrepo__get_file' || Number(summary.failures || 0) !== 0) {
              throw new Error('Brokered publicrepo MCP trace missing/failed: ' + JSON.stringify(summary));
            }
            if (String(result.text || '').trim() !== 'OPENCLAW_BROKERED_READ_MCP_OK') {
              throw new Error('Brokered publicrepo MCP final response mismatch: ' + String(result.text || '').slice(0, 300));
            }
            console.log(JSON.stringify({ ok: true, runtime: result.runtime, model: result.model, capabilities, tool_summary: summary, smoke: result.text }));
          })().catch(error => { console.error(error.message || error); process.exit(1); });
          NODE

      - name: Verify trusted OpenClaw Playwright MCP lane
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const office = require('./scripts/openclaw-office-client');
          (async () => {
            const result = await office.ask({
              profile: 'seven-of-nine',
              trusted: true,
              messages: [{
                role: 'user',
                content: 'Read-only browser smoke. Use only playwright__browser_navigate. Do not call GitHub. Call playwright__browser_navigate exactly once with https://example.com. The navigate result includes the rendered page state; confirm Example Domain is visible from that result, then reply exactly OPENCLAW_PLAYWRIGHT_MCP_OK. Do not call snapshot, evaluate, run-code, or any other tools.'
              }],
              metadata: { source: 'openclaw-admin-smoke', phase: 'playwright', repository: process.env.GITHUB_REPOSITORY }
            });
            if (result.runtime !== 'openclaw-agent-exec-trusted-tools') throw new Error('Unexpected runtime: ' + result.runtime);
            const summary = result.raw?.tool_summary;
            if (!summary || !Array.isArray(summary.tools) || !summary.tools.includes('playwright__browser_navigate') || Number(summary.failures || 0) !== 0) {
              throw new Error('Playwright MCP tool trace missing/failed: ' + JSON.stringify(summary));
            }
            console.log(JSON.stringify({ ok: true, runtime: result.runtime, model: result.model, tool_summary: summary, smoke: result.text }));
          })().catch(error => { console.error(error.message || error); process.exit(1); });
          NODE

      - name: Record successful live MCP smoke
        run: |
          mkdir -p coordination/tests
          cat > coordination/tests/openclaw-admin-live-smoke-latest.md <<EOF
          # OpenClaw Admin Office live MCP smoke

          - commit: ${GITHUB_SHA}
          - run: ${GITHUB_RUN_ID}
          - verified_at_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - GitHub MCP: OPENCLAW_GITHUB_MCP_OK (2 consecutive get_file_contents passes)
          - brokered-read publicrepo MCP: OPENCLAW_BROKERED_READ_MCP_OK (credentialless get_file pass)
          - Playwright MCP: OPENCLAW_PLAYWRIGHT_MCP_OK
          - production endpoint: https://quantdeus.vercel.app/api/quantdeus/openclaw
          EOF
          git config user.name "quantdeus-smoke[bot]"
          git config user.email "quantdeus-smoke[bot]@users.noreply.github.com"
          git add coordination/tests/openclaw-admin-live-smoke-latest.md
          if git diff --cached --quiet; then
            echo "Smoke evidence unchanged."
          else
            git commit -m "test(openclaw): record live MCP smoke pass"
            git push
          fi
