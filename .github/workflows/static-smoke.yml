name: QuantDeus Static Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check scripts/coordinator.js
          node --check scripts/governance-gate.js
          node --check scripts/site-agent-reply.js
          node --check scripts/pillar-executor.js
          node --check scripts/strategic-hub.js
          node --check scripts/orchestrator.js

      - name: Run QA syntax validator
        run: node scripts/qa/syntax-validator.js

      - name: Run QA contract validator
        run: node scripts/qa/contract-validator.js

      - name: Validate production routes
        run: |
          test -f index.html
          test -f telegram/index.html
          test -f coordination/index.html
          test -f coordination.html
          test -f coordination/agents.json
          test -f coordination/homunculi.json
          test -f coordination/startup-org.json
          test -f robots.txt
          test -f sitemap.xml
          test -f homunculi/index.html
          test -f wordpress/index.html
          test -f wordpress/blueprint.json
          grep -q '/coordination/' index.html
          grep -q 'постдефицитного' index.html
          grep -q '22 специализированных ИИ-агента' README.md
          grep -q 'sitemap.xml' robots.txt
          grep -q '/coordination/' telegram/index.html

      - name: Validate agent registry
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('coordination/agents.json','utf8'));
          if(!Array.isArray(data.agents) || data.agents.length < 8) throw new Error('agent registry too small');
          const ids=data.agents.map(a=>a.id);
          if(new Set(ids).size!==ids.length) throw new Error('duplicate agent ids');
          console.log('agents:',data.agents.length);
          NODE

      - name: Validate public-page inline JavaScript
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const pages=['index.html','site/index.html','telegram/index.html','homunculi/index.html','coordination/index.html'];
          for(const page of pages){
            const html=fs.readFileSync(page,'utf8');
            const scripts=[...html.matchAll(/<script([^>]*)>([\\s\\S]*?)<\\/script>/gi)]
              .filter(m=>!/(?:^|\\s)src=/i.test(m[1]) && !/application\\/ld\\+json/i.test(m[1]))
              .map(m=>m[2]).filter(x=>x.trim());
            for(const source of scripts) new Function(source);
            console.log(page+': inline JS OK');
          }
          NODE

      - name: Validate homunculi registry
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('coordination/homunculi.json','utf8'));
          if(!Array.isArray(data.agents) || data.agents.length < 11) throw new Error('real agent registry must contain the QuantDeus runtime agents');
          const ids=data.agents.map(a=>a.id);
          if(new Set(ids).size!==ids.length) throw new Error('duplicate agent ids');
          const expected=['coordinator','pillar-executor','strategic-hub','orchestrator','energy','justice','unity','space','potential','synthesis','control-tower'];
          for(const id of expected) if(!ids.includes(id)) throw new Error('missing homunculus '+id);
          console.log('homunculi:',ids.join(', '));
          NODE

      - name: Detect duplicate custom Pages deployers
        run: |
          if grep -R "actions/deploy-pages@" .github/workflows --include='*.yml' --include='*.yaml' | grep -v "Static Smoke"; then
            echo "Unexpected custom Pages deploy workflow detected"
            exit 1
          fi
          echo "Single Pages source: repository branch/root"
