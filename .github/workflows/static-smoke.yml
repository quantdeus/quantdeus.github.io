name: QuantDeus — статический дымовой тест

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Проверить синтаксис JavaScript
        run: |
          node --check scripts/coordinator.js
          node --check scripts/governance-gate.js
          node --check scripts/site-agent-reply.js
          node --check scripts/pillar-executor.js
          node --check scripts/strategic-hub.js
          node --check scripts/orchestrator.js

      - name: Запустить QA-валидатор синтаксиса
        run: node scripts/qa/syntax-validator.js

      - name: Запустить QA-валидатор контрактов
        run: node scripts/qa/contract-validator.js

      - name: Проверить рабочие маршруты
        run: |
          test -f index.html
          test -f telegram/index.html
          test -f coordination/index.html
          test -f coordination.html
          test -f coordination/agents.json
          test -f coordination/homunculi.json
          test -f coordination/startup-org.json
          test -f robots.txt
          test -f sitemap.xml
          test -f homunculi/index.html
          test -f wordpress/index.html
          test -f wordpress/blueprint.json
          grep -q '/coordination/' index.html
          grep -q 'Холдинг QuantDeus' index.html
          grep -q '22 агентов' README.md
          grep -q 'sitemap.xml' robots.txt
          grep -q '/coordination/' telegram/index.html

      - name: Проверить реестр агентов
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('coordination/agents.json','utf8'));
          if(!Array.isArray(data.agents) || data.agents.length < 8) throw new Error('реестр агентов слишком мал');
          const ids=data.agents.map(a=>a.id);
          if(new Set(ids).size!==ids.length) throw new Error('повторяющиеся ID агентов');
          console.log('agents:',data.agents.length);
          NODE

      - name: Проверить встроенный JavaScript гомункулов
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('homunculi/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(x=>x.trim());
          if(!scripts.length) throw new Error('встроенный скрипт гомункулов не найден');
          for(const source of scripts) new Function(source);
          console.log('встроенный JS гомункулов: ОК');
          NODE

      - name: Проверить реестр гомункулов
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('coordination/homunculi.json','utf8'));
          if(!Array.isArray(data.agents) || data.agents.length < 11) throw new Error('реестр должен содержать рабочих агентов QuantDeus');
          const ids=data.agents.map(a=>a.id);
          if(new Set(ids).size!==ids.length) throw new Error('повторяющиеся ID агентов');
          const expected=['coordinator','pillar-executor','strategic-hub','orchestrator','energy','justice','unity','space','potential','synthesis','control-tower'];
          for(const id of expected) if(!ids.includes(id)) throw new Error('отсутствует гомункул '+id);
          console.log('homunculi:',ids.join(', '));
          NODE

      - name: Проверить отсутствие дублирующих публикаций Pages
        run: |
          if grep -R "actions/deploy-pages@" .github/workflows --include='*.yml' --include='*.yaml' | grep -v "Static Smoke"; then
            echo "Обнаружен неожиданный дополнительный workflow публикации Pages"
            exit 1
          fi
          echo "Единый источник Pages: ветка/корень репозитория"
