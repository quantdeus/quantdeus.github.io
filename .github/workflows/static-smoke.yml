name: QuantDeus Static Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check scripts/coordinator.js
          node --check scripts/seven-of-nine.js
          node --check scripts/emh.js
          node --check scripts/sherlock.js
          node --check scripts/tuvok.js
          node --check scripts/governance-gate.js
          node --check scripts/site-agent-reply.js
          node --check scripts/hermes-office-bootstrap.js
          node --check scripts/hermes-office-client.js
          node --check scripts/openclaw-office-client.js
          node --check scripts/openclaw-automations-bootstrap.js
          node --check scripts/openclaw-dispatch-workflow.js
          node --check scripts/guarded-automerge.js
          node --check scripts/openclaw-evolution.js
          node --check scripts/openclaw-evolution-guard.js
          node --check scripts/qa/hermes-office-validator.js
          node --check scripts/qa/openclaw-office-validator.js
          node --check scripts/telegram-bot.js
          node --check scripts/telegram-webhook-setup.js
          node --check scripts/browser-homunculus.js
          node --check scripts/qa/browser-homunculus.test.js
          node --check scripts/pillar-executor.js
          node --check scripts/strategic-hub.js
          node --check scripts/orchestrator.js
          node --check scripts/contributor-onboarding.js
          node --check vercel-dispatcher/api/quantdeus/hourly.js
          node --check vercel-dispatcher/api/quantdeus/llm.js
          node --check vercel-dispatcher/api/quantdeus/browser.js
          node --check vercel-dispatcher/api/quantdeus/hermes.js
          node --check vercel-dispatcher/api/quantdeus/openclaw.js
          node --check vercel-dispatcher/lib/public-read-mcp-source.js
          node --check vercel-dispatcher/api/quantdeus/telegram.js
          node --check vercel-dispatcher/api/quantdeus/community.js
          node --check vercel-dispatcher/api/quantdeus/orders.js

      - name: Test forum and store API authorization and order flow
        run: node --test vercel-dispatcher/tests/portal-api.test.mjs

      - name: Verify Seven LLM briefing and degraded contract
        run: node --test scripts/qa/seven-reasoning.test.js scripts/qa/role-dialogue.test.js

      - name: Verify contributor onboarding guardrails
        run: |
          node --test scripts/qa/contributor-onboarding.test.js
          node - <<'NODE'
          const fs=require('fs');
          const must=(condition,message)=>{ if(!condition) throw new Error(message); };
          const source=fs.readFileSync('scripts/contributor-onboarding.js','utf8');
          const workflow=fs.readFileSync('.github/workflows/contributor-onboarding.yml','utf8');
          const hourly=fs.readFileSync('.github/workflows/quantdeus-hourly-openclaw.yml','utf8');
          const registry=JSON.parse(fs.readFileSync('coordination/contributors.json','utf8'));
          must(source.includes("OWNER_LOGIN = 'quantdeus'"), 'onboarding must pin CEO author');
          must(source.includes("issue.updated_at !== issue.created_at"), 'onboarding must reject edited approvals');
          must(source.includes("repository_role_mutation_by_automation: false"), 'registry mutation must deny repository role grants');
          must(!source.includes('/collaborators/'), 'onboarding executor must never call collaborator API');
          must(workflow.includes("github.ref == 'refs/heads/main'"), 'onboarding workflow must run from main only');
          must(workflow.includes('persist-credentials: false'), 'onboarding checkout must not persist credentials');
          must(hourly.includes("decision.action === 'onboard_contributor_readonly'"), 'Seven hourly dispatcher must expose guarded onboarding');
          must(hourly.includes("contributor-onboarding.yml"), 'Seven must dispatch only the constrained onboarding executor');
          const egor=(registry.contributors||[]).find(x=>x.github_login==='goplay1937');
          must(egor && egor.requested_access==='public-read-only', 'Egor must be registered as public-read-only');
          must(egor.write_access_authorized===false && egor.workflow_write_authorized===false, 'Egor write/workflow authorization must remain false');
          console.log('contributor onboarding guardrails: OK');
          NODE

      - name: Run QA syntax validator
        run: node scripts/qa/syntax-validator.js

      - name: Run QA contract validator
        run: node scripts/qa/contract-validator.js

      - name: Validate remaining runtime-gap guardrails
        run: |
          node <<'NODE'
          const fs=require('fs');
          const read=p=>fs.readFileSync(p,'utf8');
          const must=(condition,message)=>{ if(!condition) throw new Error(message); };

          const site=read('scripts/site-agent-reply.js');
          const telegram=read('vercel-dispatcher/api/quantdeus/telegram.js');
          const llmBridge=read('vercel-dispatcher/api/quantdeus/llm.js');
          must(llmBridge.includes("role === 'system' ? 50000 : 16000"), 'OIDC fallback must accept the bounded repo-grounded system prompt');
          must(llmBridge.includes('total > 90000'), 'OIDC fallback total prompt budget must remain bounded');
          for(const [name,src] of [['site',site],['telegram',telegram]]) {
            must(src.includes('STRICT_REPOSITORY_STATUS_CONTRACT'), name+' missing strict repository status contract');
            must(src.includes('validateRepositoryStatusOutput'), name+' missing deterministic status validator');
            must(src.includes('percentages_forbidden'), name+' status validator does not reject derived percentages');
            must(src.includes('task_counts total='), name+' status validator does not pin exact task counts');
            must(src.includes('action_health sampled='), name+' status validator does not pin exact Actions counts');
          }

          const failureRadar=read('scripts/qa/failure-radar.js');
          const failureRadarWorkflow=read('.github/workflows/qa-failure-radar.yml');
          const selfHeal=read('.github/workflows/qa-self-heal.yml');
          must(failureRadar.includes("const reactiveWorkflowRun = eventName === 'workflow_run'"), 'Failure Radar must distinguish reactive workflow_run events');
          must(failureRadar.includes('const scanUnresolved = !reactiveWorkflowRun'), 'Reactive success must not repair unrelated unresolved workflows');
          must(failureRadar.includes('repair_trigger_run_id='), 'Failure Radar must output the actual repair target run id');
          must(failureRadar.includes("source: 'unresolved-scan'"), 'Scheduled/manual Radar scans must preserve unresolved-run provenance');
          must(failureRadarWorkflow.includes('steps.radar.outputs.repair_trigger_run_id'), 'Failure Radar workflow must dispatch the selected failing run, not the event run');
          must(selfHeal.includes('Verify triggering run is actually repair-worthy'), 'Self-Heal must independently verify trigger conclusion');
          must(selfHeal.includes("steps.trigger.outputs.verified_failure == 'true'"), 'Self-Heal failure logs must require a verified failed run');
          must(selfHeal.includes("TRIGGER_VERIFIED_FAILURE"), 'Self-Heal must pass verified failure state into repair logic');
          must(selfHeal.includes("=== 'true'"), 'Self-Heal must not treat any non-empty run id as failure');
          must(!selfHeal.includes("Boolean(String(process.env.TRIGGER_RUN_ID || '').trim())"), 'Self-Heal must not infer failure from run id presence alone');

          const coordinator=read('.github/workflows/quantdeus-coordinator.yml');
          must(/^\s{2}issue_comment:/m.test(coordinator), 'coordinator must preserve canonical comment intake');
          must(coordinator.includes("github.event_name != 'issue_comment'"), 'coordinator comment intake must have an explicit-command job gate');
          must(coordinator.includes("startsWith(github.event.comment.body, '/coord ')"), 'coordinator must require an explicit /coord command for ordinary comments');

          const seven=read('.github/workflows/seven-priority-cycle.yml');
          must(seven.includes('trusted:false'), 'Seven priority planner must be brokered read-only');
          must(seven.includes("result.runtime!=='openclaw-agent-exec-brokered-read-tools'"), 'Seven priority planner must verify brokered read runtime');
          must(seven.includes('Seven dispatch selected non-executable Issue'), 'Seven must reject blocked/review Issues before dispatch');
          must(seven.includes('Seven dispatch selected Issue already has an open implementation PR'), 'Seven snapshot preflight must reject already represented Issues');
          must(seven.includes('agent-role dispatch Issue already has an open implementation PR'), 'Seven fresh dispatch preflight must reject already represented Issues');
          must(seven.includes("new RegExp('(?:^|[-_/])'+n+'(?:[-_/]|$)'"), 'Seven must recognize issue numbers embedded in implementation branch names');
          must(!seven.includes('or {"action":"issue"'), 'Seven planner must not directly request Issue mutation');
          must(!seven.includes('or {"action":"pr"'), 'Seven planner must not directly request PR mutation');

          const daily=read('.github/workflows/daily-swarm-learning.yml');
          for(const invariant of [
            'workflow_dispatch:',
            'contents: read',
            'actions: write',
            'id-token: write',
            'trusted: false',
            "result.runtime !== 'openclaw-agent-exec-brokered-read-tools'",
            'delete process.env.GITHUB_TOKEN',
            'delete process.env.GH_TOKEN',
            'quantdeus-hourly-openclaw.yml'
          ]) must(daily.includes(invariant), 'daily learning invariant missing: '+invariant);
          must(!/contents:\s*write/.test(daily), 'daily learning has contents write');
          must(!/issues:\s*write/.test(daily), 'daily learning has issues write');
          must(!/pull-requests:\s*write/.test(daily), 'daily learning has PR write');

          const evo=read('scripts/openclaw-evolution.js');
          const evoWorkflow=read('.github/workflows/openclaw-evolution.yml');
          for(const invariant of [
            'failClosedNoOp',
            'TRANSIENT_OPENCLAW_GENERATION',
            'MALFORMED_GENERATION_OUTPUT',
            'INVALID_GENERATION_ENVELOPE',
            'TRANSIENT_OPENCLAW_MATERIALIZATION',
            'MALFORMED_MATERIALIZATION_OUTPUT'
          ]) must(evo.includes(invariant), 'evolution fail-closed invariant missing: '+invariant);
          must(evoWorkflow.includes("github.event_name != 'push'"), 'evolution push self-test must never publish');
          must(evoWorkflow.includes("branches: [main]"), 'evolution self-test must stay scoped to main');

          console.log('remaining runtime-gap guardrails: OK');
          NODE

      - name: Verify evolution boundaries and merge guard behavior
        run: node --test scripts/qa/openclaw-evolution.test.js

      - name: Verify Browser Homunculus contract
        run: node --test scripts/qa/browser-homunculus.test.js

      - name: Validate OpenClaw Office contract
        run: |
          node scripts/qa/openclaw-office-validator.js
          node --test scripts/qa/office-session.test.js

      - name: Validate production routes
        run: |
          test -f index.html
          test -f telegram/index.html
          test -f coordination/index.html
          test -f coordination.html
          test -f coordination/agents.json
          test -f coordination/homunculi.json
          test -f coordination/contributors.json
          test -f scripts/contributor-onboarding.js
          test -f .github/workflows/contributor-onboarding.yml
          test -f coordination/hermes-office.json
          test -f coordination/hermes-evolution.json
          test -f .hermes/skills/quantdeus-autonomy/SKILL.md
          test -f .hermes/skills/quantdeus-playwright-ops/SKILL.md
          test -f .hermes/skills/quantdeus-connections-evolution/SKILL.md
          test -f docs/hermes-office.md
          test -f scripts/hermes-office-bootstrap.js
          test -f scripts/qa/hermes-office-validator.js
          test -f scripts/qa/openclaw-office-validator.js
          test -f .github/workflows/openclaw-evolution.yml
          test -f .github/workflows/daily-swarm-learning.yml
          test -f .github/workflows/openclaw-scheduler-watchdog.yml
          test -f coordination/openclaw-automations.json
          test -f scripts/openclaw-automations-bootstrap.js
          test -f scripts/openclaw-dispatch-workflow.js
          test -f .github/workflows/openclaw-evolution-pr-guard.yml
          test -f .github/workflows/openclaw-evolution-gate.yml
          test -f scripts/openclaw-evolution.js
          test -f scripts/openclaw-evolution-guard.js
          test -f .openclaw/skills/quantdeus-self-evolution/SKILL.md
          test -f coordination/openclaw-evolution.json
          test -f docs/openclaw-evolution.md
          test -f coordination/startup-org.json
          test -f robots.txt
          test -f sitemap.xml
          test -f homunculi/index.html
          test -f wordpress/index.html
          test -f wordpress/blueprint.json
          test -f vercel-dispatcher/package.json
          test -f vercel-dispatcher/vercel.json
          test -f vercel-dispatcher/api/quantdeus/hourly.js
          test -f vercel-dispatcher/api/quantdeus/browser.js
          test -f vercel-dispatcher/api/quantdeus/hermes.js
          test -f vercel-dispatcher/api/quantdeus/openclaw.js
          test -f vercel-dispatcher/api/quantdeus/telegram.js
          test -f vercel-dispatcher/api/quantdeus/community.js
          test -f vercel-dispatcher/api/quantdeus/orders.js
          test -f vercel-dispatcher/tests/portal-api.test.mjs
          test -f forum/index.html
          test -f store/index.html
          test -f store/products.json
          test -f assets/qd-portal.css
          test -f assets/qd-auth.js
          test -f telegram-public.json
          test -f docs/PORTAL_SETUP.md
          test -f vercel-dispatcher/public/forum/index.html
          test -f vercel-dispatcher/public/store/index.html
          test -f vercel-dispatcher/public/store/products.json
          test -f vercel-dispatcher/public/assets/qd-portal.css
          test -f vercel-dispatcher/public/assets/qd-auth.js
          test -f scripts/telegram-webhook-setup.js
          test -f scripts/browser-homunculus.js
          test -f .github/workflows/browser-homunculus.yml
          test -f docs/browser-homunculus.md
          if grep -qF '\\$''{{' .github/workflows/browser-homunculus.yml; then echo 'escaped GitHub expression found'; exit 1; fi
          test -f .github/workflows/telegram-bot.yml
          node -e "const fs=require('fs'); const vc=JSON.parse(fs.readFileSync('vercel-dispatcher/vercel.json','utf8')); const p=JSON.parse(fs.readFileSync('vercel-dispatcher/package.json','utf8')); if(!p.dependencies?.['@vercel/sandbox']) throw new Error('missing @vercel/sandbox'); if(!vc.functions?.['api/quantdeus/hermes.js']) throw new Error('missing Hermes maxDuration');"
          test -f assets/portal-shell.css
          test -f assets/portal-shell.js
          test -f federation/index.html
          test -f research/index.html
          test -f projects/index.html
          test -f ai-fleet/index.html
          test -f community/index.html
          test -f knowledge/index.html
          test -f login/index.html
          test -f 404.html
          test ! -f CNAME
          grep -q 'https://quantdeus.whf.bz/' index.html
          grep -q 'Публичное зеркало QuantDeus' index.html
          if grep -q 'playground.wordpress.net' index.html; then echo 'GitHub Pages root must not launch Playground'; exit 1; fi
          grep -q "location.replace('/')" wordpress/index.html
          grep -q '26 специализированных ИИ-агентов' README.md
          grep -q 'sitemap.xml' robots.txt
          grep -q '/coordination/' telegram/index.html
          grep -q 'Cosmic Frutiger Aero' telegram/index.html
          grep -q 'Автоматизация бизнеса' telegram/index.html
          grep -q 'Концерт Ксении Чередниковой' telegram/index.html
          grep -q '>Услуги<' telegram/index.html
          if grep -q 'Магазин мини-приложений' telegram/index.html; then echo 'legacy Telegram store shell found'; exit 1; fi
          grep -q 'https://quantdeus.whf.bz/forum/' forum/index.html
          grep -q 'https://quantdeus.whf.bz/services/' store/index.html
          grep -q 'noindex,follow' forum/index.html
          grep -q 'noindex,follow' store/index.html
          if grep -Fq '\n  <script' store/index.html forum/index.html; then echo 'literal \\n found in portal HTML'; exit 1; fi
          if grep -q 'if(!initData)' store/index.html; then echo 'stale initData reference found in store'; exit 1; fi
          grep -q 'needs_user_send' vercel-dispatcher/api/quantdeus/orders.js
          grep -q 'DEFAULT_CLIENT_ID = "8122160274"' vercel-dispatcher/lib/telegram-auth.js
          grep -q 'Регистрация не нужна' vercel-dispatcher/public/store/index.html
          grep -q 'anonymous_web' vercel-dispatcher/api/quantdeus/orders.js
          node -e "const c=require('./telegram-public.json'); if(!c.configured||!c.client_id||!c.username) throw new Error('Telegram public auth config is incomplete')"

      - name: Validate agent registry
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('coordination/agents.json','utf8'));
          if(!Array.isArray(data.agents) || data.agents.length < 8) throw new Error('agent registry too small');
          const ids=data.agents.map(a=>a.id);
          if(new Set(ids).size!==ids.length) throw new Error('duplicate agent ids');
          console.log('agents:',data.agents.length);
          NODE

      - name: Validate public-page inline JavaScript
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const pages=['index.html','site/index.html','telegram/index.html','homunculi/index.html','coordination/index.html','forum/index.html','store/index.html','vercel-dispatcher/public/forum/index.html','vercel-dispatcher/public/store/index.html'];
          for(const page of pages){
            const html=fs.readFileSync(page,'utf8');
            const scripts=[...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)]
              .filter(m=>!/(?:^|\s)src=/i.test(m[1]) && !/application\/ld\+json/i.test(m[1]))
              .map(m=>m[2]).filter(x=>x.trim());
            for(const source of scripts) new Function(source);
            console.log(page+': inline JS OK');
          }
          NODE

      - name: Validate homunculi registry
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('coordination/homunculi.json','utf8'));
          if(!Array.isArray(data.agents) || data.agents.length < 11) throw new Error('real agent registry must contain the QuantDeus runtime agents');
          const ids=data.agents.map(a=>a.id);
          if(new Set(ids).size!==ids.length) throw new Error('duplicate agent ids');
          const expected=['coordinator','seven-of-nine','emh','pillar-executor','strategic-hub','sherlock','tuvok','orchestrator','energy','justice','unity','space','potential','synthesis','control-tower'];
          for(const id of expected) if(!ids.includes(id)) throw new Error('missing homunculus '+id);
          console.log('homunculi:',ids.join(', '));
          NODE

      - name: Detect duplicate custom Pages deployers
        run: |
          set -euo pipefail
          mapfile -t deployers < <(grep -Rl "actions/deploy-pages@" .github/workflows --include='*.yml' --include='*.yaml' | grep -v '/static-smoke.yml$' || true)
          if [ "${#deployers[@]}" -ne 1 ] || [ "${deployers[0]:-}" != ".github/workflows/pages-live-mirror.yml" ]; then
            printf 'Unexpected Pages deployer set: %s\n' "${deployers[*]:-none}"
            exit 1
          fi
          echo "Single Pages source: auto-synced WordPress mirror workflow"
