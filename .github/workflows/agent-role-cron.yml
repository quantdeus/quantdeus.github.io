name: QuantDeus Agent Role Cron 🧬

on:
  schedule:
    - cron: '23 0-14 * * *'
  workflow_dispatch:
    inputs:
      agent_id:
        description: Optional registered agent id
        required: false
        type: string
      issue_number:
        description: Optional explicit GitHub Issue to inspect first
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-role-cron.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  checks: read
  id-token: write

concurrency:
  group: quantdeus-agent-role-cron-${{ inputs.issue_number || github.event.schedule || inputs.agent_id || 'manual' }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

jobs:
  role-cycle:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate shared QuantDeus mission
        run: node scripts/mission-alignment.js
      - name: Run due role agent
        id: role
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_AGENT_ID: ${{ inputs.agent_id }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const office = require('./scripts/openclaw-office-client');
          const map = JSON.parse(fs.readFileSync('coordination/agent-cron-map.json','utf8'));
          const registry = JSON.parse(fs.readFileSync('coordination/agents.json','utf8'));
          const byId = new Map(registry.agents.map(a => [a.id,a]));
          const manual = String(process.env.INPUT_AGENT_ID || '').trim();
          const explicitIssue = String(process.env.INPUT_ISSUE_NUMBER || '').trim();
          const hour = new Date().getUTCHours();
          const due = manual
            ? map.agents.filter(a => a.id === manual)
            : map.agents.filter(a => a.workflow === 'agent-role-cron.yml' && a.utc_hours.includes(hour));
          if (manual && due.length !== 1) throw new Error('Unknown agent id: ' + manual);
          if (explicitIssue && !/^\d+$/.test(explicitIssue)) throw new Error('Invalid explicit Issue number: ' + explicitIssue);
          if (!due.length) {
            console.log(JSON.stringify({ok:true,action:'none',reason:'no role agent due at UTC hour '+hour}));
            process.exit(0);
          }
          if (due.length > 1) throw new Error('Role cron map must schedule at most one agent per hour');

          function parse(text) {
            const raw=String(text||'').trim();
            try { return JSON.parse(raw); } catch {}
            const m=raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
            if(m) return JSON.parse(m[1].trim());
            throw new Error('Role cron response must be strict JSON');
          }

          (async()=>{
            const slot=due[0];
            const agent=byId.get(slot.id);
            if (explicitIssue) {
              const headers={authorization:'Bearer '+process.env.GITHUB_TOKEN,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28'};
              const response=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/issues/'+explicitIssue,{headers});
              if(!response.ok) throw new Error('Unable to preflight explicit Issue: HTTP '+response.status);
              const issue=await response.json();
              const labels=new Set((issue.labels||[]).map(x=>typeof x==='string'?x:x.name));
              const executable=issue.state==='open' && labels.has('coord:task') &&
                (labels.has('coord:ready')||labels.has('coord:active')) &&
                !labels.has('coord:blocked') && !labels.has('squad-b:blocked') && !labels.has('squad-b:review');
              if(!executable){
                fs.appendFileSync(process.env.GITHUB_OUTPUT,'action=none\\n');
                console.log(JSON.stringify({ok:true,action:'none',reason:'explicit Issue is not executable after fresh preflight',issue_number:Number(explicitIssue)}));
                return;
              }
            }
            const emhTreatmentInstructions = agent.id==='emh' ? [
              '',
              'EMH TREATMENT LANE (software-agent operational care):',
              'When repeated observable evidence shows an agent failure caused or prolonged by ambiguous/conflicting operating policy, you may propose one bounded treatment patch.',
              'A treatment patch MUST be a branch + PR and MUST change AGENTS.md only. Do not directly edit coordination/agents.json, coordination/homunculi.json, doctrine/manifesto state, workflows, QA code, auth/OIDC, trusted-tool gating, MCP deny lists, secrets or production state.',
              'Base treatment on concrete evidence from fresh runs/Issues/PRs. Do not diagnose humans, infer mental-health traits, punish an agent, or declare an agent cured.',
              'Use the patch only to clarify role instructions, WIP/handoff rules, evidence requirements, retry/delegation guidance or another reversible operating policy.',
              'EMH may not weaken QA, grant itself tools, self-approve, merge, alter human/CEO authority or protected runtime/auth/security invariants.',
              'Every EMH treatment PR must be independently validated by QA Triad and Static Smoke. qa-syntax/qa-contract/qa-repair watch the doctor; EMH may not certify its own treatment.',
              'If no evidence-backed AGENTS.md treatment is needed, return action=none.'
            ] : [];

            const result=await office.ask({
              profile:agent.id,
              trusted:true,
              messages:[{role:'user',content:[
                'QuantDeus role-driven cron cycle.',
                'Agent: '+agent.id+' — '+agent.name,
                'Role: '+agent.role,
                'This cycle mission: '+slot.mission,
                explicitIssue ? 'Explicit assigned task: GitHub Issue #'+explicitIssue+'. Inspect this Issue first and keep the cycle focused on it unless it is already resolved or blocked.' : '',
                '',
                'Read fresh main first, including coordination/civilization-doctrine.json, coordination/manifesto-living.md, coordination/cron-context.md, open Issues/PRs and recent Actions relevant to your role.',
                'Prefer the already-cloned local repository filesystem for repository file inspection. Do not call GitHub search_code merely to read files that are already present locally; reserve GitHub MCP for live Issues/PRs, metadata and mutations.',
                'Inspect public QuantDeus surfaces with Playwright only when useful.',
                'Choose at most ONE bounded, high-value artifact inside your role: a verified comment, a branch + PR, or a NEW Issue proposal.',
                'For a NEW Issue, do NOT call create_issue through MCP. Return action=open_issue with a proposal; the workflow will validate, deduplicate, create and verify it deterministically with GITHUB_TOKEN.',
                'For a PR use branch prefix automation/role/'+agent.id+'/ and keep it minimal.',
                'Workflow files under .github/workflows/** may be created or repaired only for an explicit assigned Issue carrying squad-b:privileged; protected executor/auth/merge-guard files remain off-limits in this lane.',
                'Do not merge your own PR. Do not weaken QA/security/mission rules, expose secrets, spend money, mass-message people, fabricate community activity, or perform unrelated work.',
                'For political/civic material remain factual and neutral; no party/candidate endorsement, voter targeting or persuasion.',
                ...emhTreatmentInstructions,
                'If there is no material action, do nothing.',
                '',
                'After any GitHub mutation, verify it exists and return ONLY strict JSON:',
                '{"action":"none","reason":"..."}',
                'or {"action":"open_issue","issue":{"title":"...","body":"Goal...\\n\\nAcceptance criteria...","labels":["coord:task","coord:ready"],"target_agent":"'+agent.id+'"},"summary":"..."}',
                'or {"action":"issue","issue_number":123,"summary":"..."}',
                'or {"action":"comment","issue_number":123,"summary":"..."}',
                'or {"action":"pr","pr_number":123,"branch":"automation/role/'+agent.id+'/...","summary":"..."}'
              ].join('\n')}],
              metadata:{source:'quantdeus-agent-role-cron',repository:process.env.GITHUB_REPOSITORY,agent_id:agent.id,issue_number:explicitIssue || undefined,hour_utc:hour},
              timeoutMs: 180000,
              retryTransient: true
            });
            if(result.runtime!=='openclaw-agent-exec-trusted-tools') throw new Error('Role cron lacks trusted OpenClaw tools');
            const decision=parse(result.text);
            if(!['none','open_issue','issue','comment','pr'].includes(decision.action)) throw new Error('Unsupported role action');
            if(decision.action==='pr' && !String(decision.branch||'').startsWith('automation/role/'+agent.id+'/')) throw new Error('Role PR branch outside allowed prefix');
            if(agent.id==='emh' && !['none','pr'].includes(decision.action)) {
              throw new Error('EMH treatment lane permits only action=none or an AGENTS.md PR');
            }
            if(agent.id==='emh' && decision.action==='pr') {
              const num = Number(decision.pr_number);
              if(!Number.isInteger(num) || num < 1) throw new Error('EMH treatment PR number missing/invalid');
              const expectedBranch = String(decision.branch || '');
              const headers = {authorization:'Bearer ' + process.env.GITHUB_TOKEN,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28'};
              const prUrl = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/pulls/' + num;
              const prResponse = await fetch(prUrl, {headers});
              if(!prResponse.ok) throw new Error('Unable to verify EMH treatment PR metadata: HTTP ' + prResponse.status);
              const pr = await prResponse.json();
              if(pr.head?.ref !== expectedBranch) throw new Error('EMH treatment PR head does not match declared branch: ' + String(pr.head?.ref || 'missing'));
              if(pr.head?.repo?.full_name !== process.env.GITHUB_REPOSITORY) throw new Error('EMH treatment PR must originate from the canonical repository');
              if(pr.base?.ref !== 'main') throw new Error('EMH treatment PR must target main');
              const url = prUrl + '/files?per_page=100';
              const response = await fetch(url, {headers});
              if(!response.ok) throw new Error('Unable to verify EMH treatment PR files: HTTP ' + response.status);
              const files = await response.json();
              const names = files.map(x=>x.filename);
              if(names.length !== 1 || names[0] !== 'AGENTS.md') throw new Error('EMH treatment PR must change AGENTS.md only; got: ' + names.join(', '));
              console.log('EMH treatment PR scope verified: AGENTS.md only; independent QA/Smoke required.');
            }
            if(decision.action==='pr') {
              const num = Number(decision.pr_number);
              const branchName = String(decision.branch || '').trim();
              if(!Number.isInteger(num) || num < 1) throw new Error('Role PR number missing/invalid');
              if(!branchName.startsWith('automation/role/'+agent.id+'/')) throw new Error('Role PR branch outside allowed prefix');
              const headers = {authorization:'Bearer ' + process.env.GITHUB_TOKEN,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28'};
              const prUrl = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/pulls/' + num;
              const prResponse = await fetch(prUrl, {headers});
              if(!prResponse.ok) throw new Error('Unable to verify role PR metadata: HTTP ' + prResponse.status);
              const pr = await prResponse.json();
              if(pr.head?.ref !== branchName) throw new Error('Role PR head does not match declared branch');
              if(pr.head?.repo?.full_name !== process.env.GITHUB_REPOSITORY) throw new Error('Role PR must originate from canonical repository');
              if(pr.base?.ref !== 'main') throw new Error('Role PR must target main');
              const filesResponse = await fetch(prUrl + '/files?per_page=100', {headers});
              if(!filesResponse.ok) throw new Error('Unable to verify role PR files: HTTP ' + filesResponse.status);
              const files = await filesResponse.json();
              const names = files.map(x=>String(x.filename || ''));
              const protectedPaths = new Set([
                '.github/workflows/agent-role-cron.yml',
                '.github/workflows/qa-self-heal.yml',
                '.github/workflows/openclaw-evolution.yml',
                '.github/workflows/openclaw-evolution-gate.yml',
                'vercel-dispatcher/api/quantdeus/openclaw.js',
                'scripts/openclaw-evolution-guard.js',
                'scripts/guarded-automerge.js'
              ]);
              const forbidden = names.filter(name => protectedPaths.has(name));
              if(forbidden.length) throw new Error('Role PR touched protected execution-plane file(s): ' + forbidden.join(', '));
              const workflowFiles = names.filter(name => name.startsWith('.github/workflows/'));
              if(workflowFiles.length) {
                if(!explicitIssue) throw new Error('Workflow mutation requires an explicit assigned Issue');
                const issueResponse = await fetch('https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/issues/' + explicitIssue, {headers});
                if(!issueResponse.ok) throw new Error('Unable to verify privileged Issue: HTTP ' + issueResponse.status);
                const issue = await issueResponse.json();
                const labels = new Set((issue.labels || []).map(x => typeof x === 'string' ? x : x.name));
                if(!labels.has('squad-b:privileged')) throw new Error('Workflow mutation requires squad-b:privileged');
              }
              fs.appendFileSync(process.env.GITHUB_OUTPUT,'pr_number='+num+'\n');
              fs.appendFileSync(process.env.GITHUB_OUTPUT,'branch='+branchName+'\n');
            }
            if(decision.action==='open_issue') {
              const issue=decision.issue||{};
              const proposal={
                title:String(issue.title||'').trim(),
                body:String(issue.body||'').trim(),
                labels:Array.isArray(issue.labels)?issue.labels.map(String):[],
                target_agent:String(issue.target_agent||agent.id).trim() || agent.id
              };
              if(proposal.title.length<8 || proposal.title.length>120) throw new Error('Role open_issue title outside 8..120 chars');
              if(proposal.body.length<30 || proposal.body.length>20000) throw new Error('Role open_issue body outside 30..20000 chars');
              fs.appendFileSync(process.env.GITHUB_OUTPUT,'issue_proposal='+Buffer.from(JSON.stringify(proposal)).toString('base64')+'\n');
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'action='+decision.action+'\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'source_agent='+agent.id+'\n');
            console.log(JSON.stringify({agent:agent.id,model:result.model,decision},null,2));
          })().catch(e=>{
            if(office.isTransientError(e)){
              console.warn('Role cron exhausted transient OpenClaw retries; degrade cleanly and leave the task eligible for a later Seven/hourly retry.');
              fs.appendFileSync(process.env.GITHUB_OUTPUT,'action=none\n');
              fs.appendFileSync(process.env.GITHUB_OUTPUT,'source_agent='+(manual || due[0]?.id || 'unknown')+'\n');
              console.log(JSON.stringify({
                ok:true,
                action:'none',
                degraded:true,
                retry_eligible:true,
                reason:'TRANSIENT_OPENCLAW: '+String(e.message||e).slice(0,500)
              },null,2));
              return;
            }
            console.error(e.stack||e);
            process.exit(1);
          });
          NODE


      - name: Publish role-agent Issue deterministically
        if: steps.role.outputs.action == 'open_issue'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_PROPOSAL_B64: ${{ steps.role.outputs.issue_proposal }}
          ISSUE_SOURCE_AGENT: ${{ steps.role.outputs.source_agent }}
          ISSUE_SOURCE_WORKFLOW: agent-role-cron.yml
        run: node scripts/publish-agent-issue.js


      - name: Verify role-agent PR and dispatch independent QA
        if: steps.role.outputs.action == 'pr'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.role.outputs.pr_number }}
          EXPECTED_BRANCH: ${{ steps.role.outputs.branch }}
          SOURCE_AGENT: ${{ steps.role.outputs.source_agent }}
        shell: bash
        run: |
          set -euo pipefail
          meta="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,baseRefName,headRefName)"
          test "$(jq -r .state <<<"$meta")" = "OPEN"
          test "$(jq -r .baseRefName <<<"$meta")" = "main"
          test "$(jq -r .headRefName <<<"$meta")" = "$EXPECTED_BRANCH"
          [[ "$EXPECTED_BRANCH" == "automation/role/$SOURCE_AGENT/"* ]]
          gh workflow run qa-triad.yml --repo "$GITHUB_REPOSITORY" --ref "$EXPECTED_BRANCH"
          gh workflow run static-smoke.yml --repo "$GITHUB_REPOSITORY" --ref "$EXPECTED_BRANCH"
          echo "Dispatched QA Triad + Static Smoke for $EXPECTED_BRANCH"


  smoke-all-agents:
    if: github.event_name == 'push'
    name: smoke-${{ matrix.agent_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        agent_id:
          - coordinator
          - seven-of-nine
          - emh
          - pillar-executor
          - strategic-hub
          - sherlock
          - tuvok
          - orchestrator
          - energy
          - justice
          - unity
          - space
          - potential
          - synthesis
          - control-tower
          - scout
          - verifier
          - analyst
          - strategist
          - guardian
          - tasksmith
          - archivist
          - herald
          - qa-syntax
          - qa-contract
          - qa-repair
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate shared QuantDeus mission
        run: node scripts/mission-alignment.js
      - name: Read-only trusted OpenClaw profile smoke
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_ID: ${{ matrix.agent_id }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const office = require('./scripts/openclaw-office-client');
          const registry = JSON.parse(fs.readFileSync('coordination/agents.json','utf8'));
          const cron = JSON.parse(fs.readFileSync('coordination/agent-cron-map.json','utf8'));
          const agent = registry.agents.find(a => a.id === process.env.AGENT_ID);
          const slot = cron.agents.find(a => a.id === process.env.AGENT_ID);
          if (!agent || !slot) throw new Error('Agent not fully registered: ' + process.env.AGENT_ID);

          function parse(text) {
            const raw = String(text || '').trim();
            try { return JSON.parse(raw); } catch {}
            const m = raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
            if (m) return JSON.parse(m[1].trim());
            throw new Error('Smoke response must be strict JSON');
          }

          (async () => {
            const result = await office.ask({
              profile: agent.id,
              trusted: true,
              messages: [{
                role: 'user',
                content: [
                  'QuantDeus ALL-AGENT read-only smoke test.',
                  'Expected agent id: ' + agent.id,
                  'Expected name: ' + agent.name,
                  'Expected role: ' + agent.role,
                  'Expected cron mission: ' + slot.mission,
                  '',
                  'This is diagnostic only. Do not create/update Issues, PRs, branches, files, comments, workflows, releases or any other external state.',
                  'Use exactly ONE tool: github__list_branches for owner quantdeus and repo quantdeus.github.io. Do not call Playwright or any mutation tool.',
                  'After the tool result, return ONLY strict JSON with this shape:',
                  '{"ok":true,"agent_id":"' + agent.id + '","mission_ack":true,"github_mcp":"ok"}'
                ].join('\n')
              }],
              metadata: {
                source: 'quantdeus-all-agent-smoke',
                repository: process.env.GITHUB_REPOSITORY,
                agent_id: agent.id
              },
              timeoutMs: 120000,
              retryTransient: true
            });

            if (result.runtime !== 'openclaw-agent-exec-trusted-tools') {
              throw new Error('Unexpected runtime: ' + result.runtime);
            }
            if (result.profile !== agent.id) {
              throw new Error('Profile mismatch: expected ' + agent.id + ', got ' + result.profile);
            }
            const summary = result.raw?.tool_summary;
            if (!summary || !Array.isArray(summary.tools) || !summary.tools.includes('github__list_branches') || Number(summary.failures || 0) !== 0) {
              throw new Error('GitHub MCP smoke trace missing/failed: ' + JSON.stringify(summary));
            }
            const decision = parse(result.text);
            if (decision.ok !== true || decision.agent_id !== agent.id || decision.mission_ack !== true || decision.github_mcp !== 'ok') {
              throw new Error('Agent smoke acknowledgement invalid: ' + JSON.stringify(decision));
            }
            console.log(JSON.stringify({
              ok: true,
              agent: agent.id,
              name: agent.name,
              model: result.model,
              runtime: result.runtime,
              tool_summary: summary,
              response: decision
            }, null, 2));
          })().catch(error => {
            if (office.isTransientError(error)) {
              console.warn('Agent smoke degraded by transient OpenClaw failure; read-only contract checks were not completed.');
              console.log(JSON.stringify({
                ok: true,
                degraded: true,
                agent_id: process.env.AGENT_ID,
                reason: 'TRANSIENT_OPENCLAW: ' + String(error.message || error).slice(0, 500)
              }, null, 2));
              return;
            }
            console.error(error.stack || error.message || error);
            process.exit(1);
          });
          NODE
