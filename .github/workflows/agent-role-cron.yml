name: QuantDeus Agent Role Cron 🧬

on:
  schedule:
    - cron: '23 0-14 * * *'
  workflow_dispatch:
    inputs:
      agent_id:
        description: Optional registered agent id
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-role-cron.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  checks: read
  id-token: write

concurrency:
  group: quantdeus-agent-role-cron-${{ github.event.schedule || inputs.agent_id || 'manual' }}
  cancel-in-progress: false

jobs:
  role-cycle:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate shared QuantDeus mission
        run: node scripts/mission-alignment.js
      - name: Run due role agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_AGENT_ID: ${{ inputs.agent_id }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const office = require('./scripts/openclaw-office-client');
          const map = JSON.parse(fs.readFileSync('coordination/agent-cron-map.json','utf8'));
          const registry = JSON.parse(fs.readFileSync('coordination/agents.json','utf8'));
          const byId = new Map(registry.agents.map(a => [a.id,a]));
          const manual = String(process.env.INPUT_AGENT_ID || '').trim();
          const hour = new Date().getUTCHours();
          const due = manual
            ? map.agents.filter(a => a.id === manual)
            : map.agents.filter(a => a.workflow === 'agent-role-cron.yml' && a.utc_hours.includes(hour));
          if (manual && due.length !== 1) throw new Error('Unknown agent id: ' + manual);
          if (!due.length) {
            console.log(JSON.stringify({ok:true,action:'none',reason:'no role agent due at UTC hour '+hour}));
            process.exit(0);
          }
          if (due.length > 1) throw new Error('Role cron map must schedule at most one agent per hour');

          function parse(text) {
            const raw=String(text||'').trim();
            try { return JSON.parse(raw); } catch {}
            const m=raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
            if(m) return JSON.parse(m[1].trim());
            throw new Error('Role cron response must be strict JSON');
          }

          (async()=>{
            const slot=due[0];
            const agent=byId.get(slot.id);
            const result=await office.ask({
              profile:agent.id,
              trusted:true,
              messages:[{role:'user',content:[
                'QuantDeus role-driven cron cycle.',
                'Agent: '+agent.id+' — '+agent.name,
                'Role: '+agent.role,
                'This cycle mission: '+slot.mission,
                '',
                'Read fresh main first, including coordination/civilization-doctrine.json, coordination/manifesto-living.md, coordination/cron-context.md, open Issues/PRs and recent Actions relevant to your role.',
                'Inspect public QuantDeus surfaces with Playwright only when useful.',
                'Choose at most ONE bounded, high-value artifact inside your role: a verified Issue/comment, or a branch + PR.',
                'For a PR use branch prefix automation/role/'+agent.id+'/ and keep it minimal.',
                'Do not merge your own PR. Do not weaken QA/security/mission rules, expose secrets, spend money, mass-message people, fabricate community activity, or perform unrelated work.',
                'For political/civic material remain factual and neutral; no party/candidate endorsement, voter targeting or persuasion.',
                'If there is no material action, do nothing.',
                '',
                'After any GitHub mutation, verify it exists and return ONLY strict JSON:',
                '{"action":"none","reason":"..."}',
                'or {"action":"issue","issue_number":123,"summary":"..."}',
                'or {"action":"comment","issue_number":123,"summary":"..."}',
                'or {"action":"pr","pr_number":123,"branch":"automation/role/'+agent.id+'/...","summary":"..."}'
              ].join('\n')}],
              metadata:{source:'quantdeus-agent-role-cron',repository:process.env.GITHUB_REPOSITORY,agent_id:agent.id,hour_utc:hour}
            });
            if(result.runtime!=='openclaw-agent-exec-trusted-tools') throw new Error('Role cron lacks trusted OpenClaw tools');
            const decision=parse(result.text);
            if(!['none','issue','comment','pr'].includes(decision.action)) throw new Error('Unsupported role action');
            if(decision.action==='pr' && !String(decision.branch||'').startsWith('automation/role/'+agent.id+'/')) throw new Error('Role PR branch outside allowed prefix');
            console.log(JSON.stringify({agent:agent.id,model:result.model,decision},null,2));
          })().catch(e=>{console.error(e.stack||e);process.exit(1);});
          NODE


  smoke-all-agents:
    if: github.event_name == 'push'
    name: smoke-${{ matrix.agent_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        agent_id:
          - coordinator
          - seven-of-nine
          - emh
          - pillar-executor
          - strategic-hub
          - sherlock
          - tuvok
          - orchestrator
          - energy
          - justice
          - unity
          - space
          - potential
          - synthesis
          - control-tower
          - scout
          - verifier
          - analyst
          - strategist
          - guardian
          - tasksmith
          - archivist
          - herald
          - qa-syntax
          - qa-contract
          - qa-repair
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate shared QuantDeus mission
        run: node scripts/mission-alignment.js
      - name: Read-only trusted OpenClaw profile smoke
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_ID: ${{ matrix.agent_id }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const office = require('./scripts/openclaw-office-client');
          const registry = JSON.parse(fs.readFileSync('coordination/agents.json','utf8'));
          const cron = JSON.parse(fs.readFileSync('coordination/agent-cron-map.json','utf8'));
          const agent = registry.agents.find(a => a.id === process.env.AGENT_ID);
          const slot = cron.agents.find(a => a.id === process.env.AGENT_ID);
          if (!agent || !slot) throw new Error('Agent not fully registered: ' + process.env.AGENT_ID);

          function parse(text) {
            const raw = String(text || '').trim();
            try { return JSON.parse(raw); } catch {}
            const m = raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
            if (m) return JSON.parse(m[1].trim());
            throw new Error('Smoke response must be strict JSON');
          }

          (async () => {
            const result = await office.ask({
              profile: agent.id,
              trusted: true,
              messages: [{
                role: 'user',
                content: [
                  'QuantDeus ALL-AGENT read-only smoke test.',
                  'Expected agent id: ' + agent.id,
                  'Expected name: ' + agent.name,
                  'Expected role: ' + agent.role,
                  'Expected cron mission: ' + slot.mission,
                  '',
                  'This is diagnostic only. Do not create/update Issues, PRs, branches, files, comments, workflows, releases or any other external state.',
                  'Use exactly ONE tool: github__list_branches for owner quantdeus and repo quantdeus.github.io. Do not call Playwright or any mutation tool.',
                  'After the tool result, return ONLY strict JSON with this shape:',
                  '{"ok":true,"agent_id":"' + agent.id + '","mission_ack":true,"github_mcp":"ok"}'
                ].join('\n')
              }],
              metadata: {
                source: 'quantdeus-all-agent-smoke',
                repository: process.env.GITHUB_REPOSITORY,
                agent_id: agent.id
              }
            });

            if (result.runtime !== 'openclaw-agent-exec-trusted-tools') {
              throw new Error('Unexpected runtime: ' + result.runtime);
            }
            if (result.profile !== agent.id) {
              throw new Error('Profile mismatch: expected ' + agent.id + ', got ' + result.profile);
            }
            const summary = result.raw?.tool_summary;
            if (!summary || !Array.isArray(summary.tools) || !summary.tools.includes('github__list_branches') || Number(summary.failures || 0) !== 0) {
              throw new Error('GitHub MCP smoke trace missing/failed: ' + JSON.stringify(summary));
            }
            const decision = parse(result.text);
            if (decision.ok !== true || decision.agent_id !== agent.id || decision.mission_ack !== true || decision.github_mcp !== 'ok') {
              throw new Error('Agent smoke acknowledgement invalid: ' + JSON.stringify(decision));
            }
            console.log(JSON.stringify({
              ok: true,
              agent: agent.id,
              name: agent.name,
              model: result.model,
              runtime: result.runtime,
              tool_summary: summary,
              response: decision
            }, null, 2));
          })().catch(error => {
            console.error(error.stack || error.message || error);
            process.exit(1);
          });
          NODE
