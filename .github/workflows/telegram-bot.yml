name: QuantDeus — управление ботами Telegram 🤖
run-name: "Работа Telegram-бота"

on:
  workflow_dispatch:
    inputs:
      telegram_update_b64:
        description: Закодированное сообщение Telegram для резервной обработки
        required: false
        type: string
      telegram_update_id:
        description: Номер сообщения Telegram для проверки повторов
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-bot.yml'
      - 'scripts/telegram-bot.js'
      - 'scripts/openclaw-office-client.js'
      - 'scripts/github-oidc.js'
      - 'scripts/telegram-webhook-setup.js'
      - 'scripts/telegram-retry-smoke.js'
      - 'vercel-dispatcher/api/quantdeus/telegram.js'
      - 'coordination/agents.json'

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  id-token: write

concurrency:
  group: quantdeus-telegram-${{ inputs.telegram_update_id || github.run_id }}
  cancel-in-progress: false

jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Проверить shared QuantDeus mission
        run: node scripts/mission-alignment.js

      - name: Настроить отдельные вебхуки магазина и агентов
        if: ${{ inputs.telegram_update_b64 == '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.QUANTDEUS_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN || secrets.TELEGRAM }}
          TELEGRAM_STORE_BOT_TOKEN: ${{ secrets.QUANTDEUS_STORE_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_STORE_BOT_TOKEN || secrets.QUANTDEUS_STORE_BOT_TOKEN || secrets.STORE_TELEGRAM_BOT_TOKEN || secrets.QUANTDEUS_STORE_TOKEN }}
        run: node scripts/telegram-webhook-setup.js
      
      - name: Опубликовать имя бота магазина без секретов
        if: ${{ inputs.telegram_update_b64 == '' }}
        run: |
          if [ ! -f telegram-store-public.json ]; then
            echo "Отдельный бот магазина пока не настроен."
            exit 0
          fi
          git config user.name "QuantDeus Automation"
          git config user.email "actions@users.noreply.github.com"
          git add telegram-store-public.json
          if git diff --cached --quiet; then
            echo "Публичное имя бота уже актуально."
            exit 0
          fi
          git commit -m "Обновить публичное имя магазина Telegram"
          git push origin HEAD:main

      - name: Проверить Vercel → Actions retry lane
        if: ${{ github.event_name == 'push' }}
        run: node scripts/telegram-retry-smoke.js

      - name: Route Telegram update to QuantDeus homunculi
        if: ${{ inputs.telegram_update_b64 != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.QUANTDEUS_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN || secrets.TELEGRAM }}
          QUANTDEUS_PRO_PAYMENT_PROVIDERS_JSON: ${{ secrets.QUANTDEUS_PRO_PAYMENT_PROVIDERS_JSON }}
          QUANTDEUS_OWNER_TELEGRAM_IDS: ${{ secrets.QUANTDEUS_OWNER_TELEGRAM_IDS || vars.QUANTDEUS_OWNER_TELEGRAM_IDS }}
          QUANTDEUS_ADMIN_TELEGRAM_IDS: ${{ secrets.QUANTDEUS_ADMIN_TELEGRAM_IDS || vars.QUANTDEUS_ADMIN_TELEGRAM_IDS }}
          QUANTDEUS_MODERATOR_TELEGRAM_IDS: ${{ secrets.QUANTDEUS_MODERATOR_TELEGRAM_IDS || vars.QUANTDEUS_MODERATOR_TELEGRAM_IDS }}
          TELEGRAM_ADMIN_USER_IDS: ${{ secrets.TELEGRAM_ADMIN_USER_IDS || vars.TELEGRAM_ADMIN_USER_IDS }}
          TELEGRAM_UPDATE_B64: ${{ inputs.telegram_update_b64 }}
          TELEGRAM_UPDATE_ID: ${{ inputs.telegram_update_id }}
        run: node scripts/telegram-bot.js
