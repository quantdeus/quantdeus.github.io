name: Deploy QuantDeus Store Mini App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "quantdeus-store-pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build public Pages artifact
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.QUANTDEUS_TELEGRAM_BOT_TOKEN }}
        run: |
          rm -rf dist
          mkdir -p dist/telegram dist/coordination
          cp site/index.html dist/index.html
          cp site/coordination.html dist/coordination.html
          cp site/coordination/index.html dist/coordination/index.html
          cp coordination/agents.json dist/coordination/agents.json
          cp site/habr-test.html dist/habr-test.html
          cp telegram/index.html dist/telegram/index.html

          # Publish only non-secret bot identity needed by browser Telegram Login.
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ]; then
            curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") if d.get("ok") else None; out={"configured":bool(r)}; out.update({"bot_id":r.get("id"),"client_id":r.get("id"),"username":r.get("username"),"name":r.get("first_name")} if r else {}); open("dist/telegram-public.json","w").write(json.dumps(out,ensure_ascii=False))'
          else
            printf '{"configured":false}' > dist/telegram-public.json
          fi
          cp dist/telegram-public.json dist/telegram/telegram-public.json
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
