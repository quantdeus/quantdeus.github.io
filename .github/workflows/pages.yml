name: Deploy QuantDeus Store Mini App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "quantdeus-store-pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build public Pages artifact
        run: |
          rm -rf dist
          mkdir -p dist/telegram dist/coordination
          cp site/index.html dist/index.html
          cp site/coordination.html dist/coordination.html
          cp site/coordination/index.html dist/coordination/index.html
          cp coordination/agents.json dist/coordination/agents.json
          cp site/habr-test.html dist/habr-test.html
          cp telegram/index.html dist/telegram/index.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
