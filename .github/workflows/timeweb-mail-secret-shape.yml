name: QuantDeus — безопасная диагностика формата почтового секрета

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-shape:
    name: Проверить только структуру без раскрытия пароля
    if: github.repository == 'quantdeus/quantdeus.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Вывести только признаки формата без содержимого
        env:
          QD_MAIL_DATA: ${{ secrets.QD_MAIL_DATA }}
        run: |
          python3 scripts/timeweb_mail_bridge.py --diagnose-secret
