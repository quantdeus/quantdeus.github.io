name: QuantDeus OpenClaw Evolution 🧬

on:
  schedule:
    - cron: '31 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/openclaw-evolution.js'
      - '.github/workflows/openclaw-evolution.yml'

permissions: {}

concurrency:
  group: quantdeus-openclaw-evolution
  cancel-in-progress: false

jobs:
  observe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      id-token: write
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate shared QuantDeus mission
        run: node scripts/mission-alignment.js
      - name: Collect operational evidence with read-only credentials
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/qd-openclaw-evolution
          gh run list --repo "$GITHUB_REPOSITORY" --limit 80 --json databaseId,workflowName,status,conclusion,headSha,url > /tmp/qd-openclaw-evolution/actions.json
          gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 60 --json number,title,state,headRefName,url > /tmp/qd-openclaw-evolution/prs.json
          gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 80 --json number,title,state,url > /tmp/qd-openclaw-evolution/issues.json
      - name: Inference-only evidence-backed proposal (no tools, no GitHub token)
        env:
          EVOLUTION_BASE_SHA: ${{ steps.base.outputs.sha }}
        run: node scripts/openclaw-evolution.js observe
      - name: Upload evolution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantdeus-openclaw-evolution
          path: /tmp/qd-openclaw-evolution/
          if-no-files-found: error

  propose:
    needs: observe
    # A push is a read-only self-test of the inference lane; publication remains
    # limited to the scheduled/manual evolution cycle.
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.observe.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: quantdeus-openclaw-evolution
          path: /tmp/qd-openclaw-evolution/
      - name: Validate shared QuantDeus mission before bounded PR creation
        run: node scripts/mission-alignment.js
      - name: Validate proposal and create exactly one review-only PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVOLUTION_BASE_SHA: ${{ needs.observe.outputs.base_sha }}
        run: node scripts/openclaw-evolution.js propose
      - name: Upload independently verified publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantdeus-openclaw-evolution-publication
          path: /tmp/qd-openclaw-evolution/publication.json
          if-no-files-found: warn

