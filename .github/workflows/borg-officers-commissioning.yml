name: 26-Agent Borg Officers Commissioning ⭐🖖

on:
  push:
    branches: [agent-review-discipline-v1]
    paths:
      - '.github/workflows/borg-officers-commissioning.yml'

permissions:
  contents: read
  issues: write

jobs:
  commission:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate 26-agent registry contracts
        run: node scripts/qa/contract-validator.js
      - name: 🖖 Seven of Nine — efficiency
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUANTDEUS_COORDINATION_HUB_ISSUE: '9'
        run: node scripts/seven-of-nine.js
      - name: 🩺 EMH — mediation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUANTDEUS_COORDINATION_HUB_ISSUE: '9'
        run: node scripts/emh.js
      - name: 🕵️ Sherlock — science investigation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUANTDEUS_COORDINATION_HUB_ISSUE: '9'
        run: node scripts/sherlock.js
      - name: 🖖 Tuvok — logic integrity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUANTDEUS_COORDINATION_HUB_ISSUE: '9'
        run: node scripts/tuvok.js
