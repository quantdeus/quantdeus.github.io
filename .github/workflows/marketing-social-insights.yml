name: QuantDeus — экономная аналитика YouTube и VK
run-name: "Мартышки: статистика без лишних запросов"

on:
  schedule:
    - cron: '19 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantdeus-social-insights-readonly
  cancel-in-progress: true

jobs:
  social-insights:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      COMPOSIO_API: ${{ secrets.COMPOSIO_API }}
      VK_TOKEN_GROUP: ${{ secrets.VK_TOKEN_GROUP }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Проверить ссылки на услуги и расчёт продаж без API
        run: node --test scripts/qa/marketing-sales.test.mjs
      - name: Прочитать YouTube и VK ровно по одному разу
        run: node scripts/marketing-social-insights.mjs
