name: QuantDeus — триада QA 🦀

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:

concurrency:
  group: quantdeus-qa-triad-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 🩺 Проверить всех агентов
        run: node scripts/agent-monitor.js

      - name: 🔎 QA-валидатор синтаксиса
        id: syntax
        continue-on-error: true
        run: node scripts/qa/syntax-validator.js

      - name: 🧩 QA-валидатор контрактов
        id: contract
        continue-on-error: true
        run: node scripts/qa/contract-validator.js

      - name: 🛠️ Координатор QA-исправлений
        env:
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
          QA_CREATE_ISSUE: ${{ github.event_name != 'pull_request' && '1' || '0' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/qa/repair-coordinator.js

      - name: Загрузить отчёты QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantdeus-qa-triad
          path: /tmp/quantdeus-qa-*.json
          if-no-files-found: error
