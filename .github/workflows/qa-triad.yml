name: QuantDeus QA Triad 🦀

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quantdeus-qa-triad-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Seven LLM briefing and degraded contract
        run: node --test scripts/qa/seven-reasoning.test.js scripts/qa/role-dialogue.test.js

      - name: 🛒 Portal API authorization and lifecycle contract
        run: |
          node --check vercel-dispatcher/api/quantdeus/community.js
          node --check vercel-dispatcher/api/quantdeus/orders.js
          node --test vercel-dispatcher/tests/portal-api.test.mjs

      - name: 🌐 Validate shared post-scarcity mission
        id: mission
        continue-on-error: true
        run: node scripts/mission-alignment.js

      - name: Verify evolution boundaries and merge guard behavior
        run: node --test scripts/qa/openclaw-evolution.test.js

      - name: 🩺 Run all-agent monitor
        id: monitor
        continue-on-error: true
        run: node scripts/agent-monitor.js

      - name: 🔎 QA Syntax Validator
        id: syntax
        continue-on-error: true
        run: node scripts/qa/syntax-validator.js

      - name: 🧩 QA Contract Validator
        id: contract
        continue-on-error: true
        run: node scripts/qa/contract-validator.js

      - name: 🛠️ QA Repair Coordinator
        env:
          MISSION_OUTCOME: ${{ steps.mission.outcome }}
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
          QA_CREATE_ISSUE: ${{ github.event_name != 'pull_request' && '1' || '0' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/qa/repair-coordinator.js

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantdeus-qa-triad
          path: |
            /tmp/quantdeus-qa-*.json
            /tmp/quantdeus-mission-alignment.json
            /tmp/quantdeus-agent-health.json
          if-no-files-found: error

