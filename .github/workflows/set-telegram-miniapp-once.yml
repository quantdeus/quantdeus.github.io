name: Set Telegram Mini App URL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/set-telegram-miniapp-once.yml'

permissions:
  contents: write

jobs:
  bind:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[bind-telegram-miniapp]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Telegram configuration
        id: telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.QUANTDEUS_TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Telegram bot not bound::Add repository secret QUANTDEUS_TELEGRAM_BOT_TOKEN, then run this workflow manually."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe"             | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True, d.get("description","getMe failed"); r=d["result"]; print("Telegram bot:", "@"+r.get("username","?"), "id="+str(r.get("id","?")))'

      - name: Bind QuantDeus Mini App menu
        if: steps.telegram.outputs.configured == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.QUANTDEUS_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setChatMenuButton"             -H 'Content-Type: application/json'             --data '{"menu_button":{"type":"web_app","text":"QuantDeus","web_app":{"url":"https://quantdeus.github.io/telegram/"}}}')
          printf '%s' "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("result") is True, d.get("description","setChatMenuButton failed"); print("Telegram menu points to https://quantdeus.github.io/telegram/")'

      - name: Verify Telegram menu
        if: steps.telegram.outputs.configured == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.QUANTDEUS_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getChatMenuButton"             | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True, d.get("description","getChatMenuButton failed"); b=d.get("result",{}); url=((b.get("web_app") or {}).get("url")); assert url=="https://quantdeus.github.io/telegram/", "unexpected menu URL: "+str(url); print("Verified:", b.get("text"), url)'

      - name: Publish public Telegram Login config
        if: steps.telegram.outputs.configured == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.QUANTDEUS_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" > /tmp/qd-getme.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/qd-getme.json'))
          assert d.get('ok') is True, d.get('description','getMe failed')
          r=d['result']
          out={
            'configured': True,
            'bot_id': r.get('id'),
            'client_id': r.get('id'),
            'username': r.get('username'),
            'name': r.get('first_name'),
          }
          open('telegram-public.json','w').write(json.dumps(out,ensure_ascii=False)+'\n')
          PY
          git config user.name "quantdeus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add telegram-public.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Telegram public auth config"
            git push
          fi
