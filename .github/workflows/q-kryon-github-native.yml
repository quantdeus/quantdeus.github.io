name: QuantDeus Q + Kryon Native Recon 🃏✨
run-name: "Задачи Q и Крайона"

on:
  schedule:
    - cron: '23 16 * * *'
    - cron: '23 17 * * *'
  workflow_dispatch:
    inputs:
      agent_id:
        description: 'Run one scout or both'
        type: choice
        required: true
        default: both
        options:
          - both
          - q
          - kryon
  push:
    branches: [main]
    paths:
      - '.github/workflows/q-kryon-github-native.yml'
      - 'scripts/q-kryon-github-native.js'
      - 'scripts/q-kryon-openclaw.js'
      - 'coordination/q-persona.md'
      - 'coordination/kryon-persona.md'

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: quantdeus-q-kryon-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-recon:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Проверить QuantDeus shared mission
        run: node scripts/mission-alignment.js
      - name: Read real GitHub Issues and PRs without Vercel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_ID: ${{ inputs.agent_id || 'both' }}
          GITHUB_SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/q-kryon-github-native.js
      - name: Установить actual OpenClaw CLI on GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          npm i -g openclaw@latest --allow-scripts=openclaw
          openclaw --version

      - name: Configure verified Cloudflare Workers AI Gemma 4 provider
        shell: bash
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_KEY:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Gemma 4 migration requires GitHub Actions secrets CLOUDFLARE_API_KEY and CLOUDFLARE_ACCOUNT_ID. No silent fallback to Qwen is allowed."
            exit 1
          fi
          export OPENCLAW_HOME="$RUNNER_TEMP/quantdeus-openclaw"
          export OPENCLAW_STATE_DIR="$OPENCLAW_HOME/state"
          openclaw setup --baseline
          openclaw config set models.providers.quantdeus-gemma4 '{"baseUrl":"https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1","api":"openai-completions","apiKey":"${CLOUDFLARE_API_KEY}","models":[{"id":"@cf/google/gemma-4-26b-a4b-it","name":"Gemma 4 26B A4B IT","contextWindow":1000000,"maxTokens":4096}]}' --strict-json --merge
          openclaw models list --provider quantdeus-gemma4

      - name: Register Q + Kryon as isolated OpenClaw Gemma 4 profiles
        shell: bash
        env:
          AGENT_ID: ${{ inputs.agent_id || 'both' }}
          GITHUB_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          export OPENCLAW_HOME="$RUNNER_TEMP/quantdeus-openclaw"
          export OPENCLAW_STATE_DIR="$OPENCLAW_HOME/state"
          case "${GITHUB_EVENT_NAME:-}" in
            schedule)
              case "$GITHUB_SCHEDULE" in
                '23 16 * * *') ids=(q) ;;
                '23 17 * * *') ids=(kryon) ;;
                *) echo "::error::Unknown native OpenClaw schedule"; exit 1 ;;
              esac ;;
            *)
              case "$AGENT_ID" in
                q) ids=(q) ;;
                kryon) ids=(kryon) ;;
                both) ids=(q kryon) ;;
                *) echo "::error::Unknown native OpenClaw agent request"; exit 1 ;;
              esac ;;
          esac
          for id in "${ids[@]}"; do
            node scripts/q-kryon-openclaw.js prepare "$id"
            openclaw agents add "$id" --workspace "$PWD/artifacts/openclaw-native/$id" --model 'quantdeus-gemma4/@cf/google/gemma-4-26b-a4b-it' --non-interactive --json
          done
          openclaw agents list --json > artifacts/openclaw-native/registered-agents.json
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("artifacts/openclaw-native/registered-agents.json"));const t=JSON.stringify(d);for(const id of process.argv.slice(1)){if(!new RegExp("\\b"+id+"\\b").test(t))throw Error("OpenClaw agent absent: "+id)}console.log("REAL_OPENCLAW_GEMMA4_PROFILES_REGISTERED",process.argv.slice(1).join(","))' "${ids[@]}"

      - name: Выполнить real OpenClaw Gemma 4 model turns (no Vercel)
        shell: bash
        env:
          AGENT_ID: ${{ inputs.agent_id || 'both' }}
          GITHUB_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          export OPENCLAW_HOME="$RUNNER_TEMP/quantdeus-openclaw"
          export OPENCLAW_STATE_DIR="$OPENCLAW_HOME/state"
          case "${GITHUB_EVENT_NAME:-}" in
            schedule)
              case "$GITHUB_SCHEDULE" in
                '23 16 * * *') ids=(q) ;;
                '23 17 * * *') ids=(kryon) ;;
                *) exit 1 ;;
              esac ;;
            *)
              case "$AGENT_ID" in
                q) ids=(q) ;;
                kryon) ids=(kryon) ;;
                both) ids=(q kryon) ;;
                *) exit 1 ;;
              esac ;;
          esac
          for id in "${ids[@]}"; do
            openclaw agent --local --agent "$id" --message "$(cat "artifacts/openclaw-native/$id/TASK.md")" --json > "artifacts/openclaw-native/$id/raw-result.json"
            node scripts/q-kryon-openclaw.js verify "$id"
          done

      - name: Preserve read-only evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: q-kryon-native-recon-${{ github.run_id }}
          path: |
            artifacts/native-agent-evidence/*.md
            artifacts/openclaw-native/**
          if-no-files-found: error
          retention-days: 14
        if: always()
