name: QuantDeus Q + Kryon Native Recon 🃏✨
run-name: "Задачи Q и Крайона"

on:
  schedule:
    - cron: '23 16 * * *'
    - cron: '23 17 * * *'
  workflow_dispatch:
    inputs:
      agent_id:
        description: 'Run one scout or both'
        type: choice
        required: true
        default: both
        options:
          - both
          - q
          - kryon
  push:
    branches: [main]
    paths:
      - '.github/workflows/q-kryon-github-native.yml'
      - 'scripts/q-kryon-github-native.js'
      - 'scripts/q-kryon-openclaw.js'
      - 'coordination/q-persona.md'
      - 'coordination/kryon-persona.md'

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: quantdeus-q-kryon-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-recon:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Проверить QuantDeus shared mission
        run: node scripts/mission-alignment.js
      - name: Read real GitHub Issues and PRs without Vercel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_ID: ${{ inputs.agent_id || 'both' }}
          GITHUB_SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/q-kryon-github-native.js
      - name: Установить actual OpenClaw CLI on GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          npm i -g openclaw@latest --allow-scripts=openclaw
          openclaw --version

      - name: Установить Ollama on GitHub runner (local keyless model API)
        uses: ai-action/setup-ollama@v2
        with:
          version: '0.32.15'

      - name: Запустить local LLM service and pull a small open model
        shell: bash
        run: |
          set -euo pipefail
          ollama serve > "$RUNNER_TEMP/quantdeus-ollama.log" 2>&1 &
          for i in {1..40}; do
            if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --silent --show-error --fail http://127.0.0.1:11434/api/tags > /dev/null
          ollama pull qwen2.5:1.5b
          ollama list
          test "$(ollama list | grep -c 'qwen2.5:1.5b')" -ge 1

      - name: Register Q + Kryon as isolated OpenClaw agent profiles
        shell: bash
        env:
          OLLAMA_API_KEY: ollama-local
          AGENT_ID: ${{ inputs.agent_id || 'both' }}
          GITHUB_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          export OPENCLAW_HOME="$RUNNER_TEMP/quantdeus-openclaw"
          export OPENCLAW_STATE_DIR="$OPENCLAW_HOME/state"
          openclaw setup --baseline
          openclaw models list --provider ollama
          case "${GITHUB_EVENT_NAME:-}" in
            schedule)
              case "$GITHUB_SCHEDULE" in
                '23 16 * * *') ids=(q) ;;
                '23 17 * * *') ids=(kryon) ;;
                *) echo "::error::Unknown native OpenClaw schedule"; exit 1 ;;
              esac ;;
            *)
              case "$AGENT_ID" in
                q) ids=(q) ;;
                kryon) ids=(kryon) ;;
                both) ids=(q kryon) ;;
                *) echo "::error::Unknown native OpenClaw agent request"; exit 1 ;;
              esac ;;
          esac
          for id in "${ids[@]}"; do
            node scripts/q-kryon-openclaw.js prepare "$id"
            openclaw agents add "$id" --workspace "$PWD/artifacts/openclaw-native/$id" --model ollama/qwen2.5:1.5b --non-interactive --json
          done
          openclaw agents list --json > artifacts/openclaw-native/registered-agents.json
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("artifacts/openclaw-native/registered-agents.json"));const t=JSON.stringify(d);for(const id of process.argv.slice(1)){if(!new RegExp("\\b"+id+"\\b").test(t))throw Error("OpenClaw agent absent: "+id)}console.log("REAL_OPENCLAW_PROFILES_REGISTERED",process.argv.slice(1).join(","))' "${ids[@]}"

      - name: Выполнить real OpenClaw model turns (no Vercel)
        shell: bash
        env:
          OLLAMA_API_KEY: ollama-local
          AGENT_ID: ${{ inputs.agent_id || 'both' }}
          GITHUB_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          export OPENCLAW_HOME="$RUNNER_TEMP/quantdeus-openclaw"
          export OPENCLAW_STATE_DIR="$OPENCLAW_HOME/state"
          case "${GITHUB_EVENT_NAME:-}" in
            schedule)
              case "$GITHUB_SCHEDULE" in
                '23 16 * * *') ids=(q) ;;
                '23 17 * * *') ids=(kryon) ;;
                *) exit 1 ;;
              esac ;;
            *)
              case "$AGENT_ID" in
                q) ids=(q) ;;
                kryon) ids=(kryon) ;;
                both) ids=(q kryon) ;;
                *) exit 1 ;;
              esac ;;
          esac
          echo "Using Ollama local API on GitHub Actions; external provider credentials not needed"
          curl --silent --show-error --fail http://127.0.0.1:11434/api/tags > /dev/null
          for id in "${ids[@]}"; do
            openclaw agent --local --agent "$id" --message "$(cat "artifacts/openclaw-native/$id/TASK.md")" --json > "artifacts/openclaw-native/$id/raw-result.json"
            node scripts/q-kryon-openclaw.js verify "$id"
          done

      - name: Preserve read-only evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: q-kryon-native-recon-${{ github.run_id }}
          path: |
            artifacts/native-agent-evidence/*.md
            artifacts/openclaw-native/**
          if-no-files-found: error
          retention-days: 14
        if: always()
