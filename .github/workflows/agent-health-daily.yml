name: QuantDeus — суточная проверка здоровья агентов 🩺

on:
  schedule:
    # Один раз в сутки в 06:17 UTC. Проверяет всех агентов и цивилизационную доктрину.
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: quantdeus-agent-health-daily
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Проверить всех зарегистрированных агентов
        id: health
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/agent-monitor.js

      - name: Загрузить отчёт о здоровье
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantdeus-agent-health
          path: /tmp/quantdeus-agent-health.json
          if-no-files-found: ignore

      - name: Создать/обновить Issue мониторинга при ошибке
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "[ЗДОРОВЬЕ АГЕНТОВ] Суточная проверка завершилась ошибкой" \
            --body "Суточный мониторинг агентов обнаружил одну или несколько ошибок. Подробности — в запуске workflow и загруженном отчёте." \
            --label "coord:human" || true
