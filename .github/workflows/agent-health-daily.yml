name: QuantDeus Crew Health Check 🩺🖖

on:
  schedule:
    # Every 2 hours at :19 UTC, staggered away from Seven (:11) and hourly OpenClaw (:00).
    - cron: '19 */2 * * *'
  workflow_dispatch:

concurrency:
  group: quantdeus-crew-health
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate shared post-scarcity mission
        id: mission
        run: node scripts/mission-alignment.js

      - name: Check registered agents + bridge crew
        id: health
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/agent-monitor.js

      - name: Publish bridge summary
        if: always()
        run: |
          if [ -f /tmp/quantdeus-agent-health.md ]; then
            cat /tmp/quantdeus-agent-health.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload crew health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantdeus-crew-health
          path: |
            /tmp/quantdeus-agent-health.json
            /tmp/quantdeus-agent-health.md
            /tmp/quantdeus-mission-alignment.json
          if-no-files-found: ignore

      - name: Create or update monitoring issue on hard failure
        if: steps.health.outcome == 'failure' || steps.mission.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="[AGENT HEALTH] Crew health check failed"
          existing="$(gh issue list --state open --search \"$title in:title\" --json number --jq '.[].number' | head -n 1)"
          body="Crew health monitoring detected a hard failure. See this workflow run and the uploaded crew-health artifact for exact evidence."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" || true
          else
            gh issue create --title "$title" --body "$body" --label "coord:human" || true
          fi
