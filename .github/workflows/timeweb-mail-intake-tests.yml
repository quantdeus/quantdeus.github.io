name: QuantDeus — проверка приёмника почты Timeweb без отправки

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/timeweb_mail_bridge.py'
      - 'scripts/tests/test_timeweb_mail_bridge.py'
      - 'docs/timeweb-corporate-mail-intake.md'
      - '.github/workflows/timeweb-mail-intake-tests.yml'

permissions:
  contents: read

jobs:
  offline-mail-gates:
    name: Безопасная проверка обработки входящих писем
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверить локальную обработку без сети и секретов
        env:
          QD_MAIL_POLL_ENABLED: '0'
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_timeweb_mail_bridge.py' -v
          python3 scripts/timeweb_mail_bridge.py --smoke
