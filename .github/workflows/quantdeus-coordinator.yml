name: QuantDeus Seven + Swarm Secretary 🖖🗂️

on:
  schedule:
    - cron: '27 6 * * *'
  workflow_dispatch:
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: write
  id-token: write

concurrency:
  # One serialized coordination lane for schedule/manual/Issue-state events.
  # Ordinary chat comments belong to Site Agent Replies and must not start a second control plane.
  group: quantdeus-coordinator
  cancel-in-progress: false

jobs:
  coordinate:
    # Keep the canonical issue_comment intake, but ordinary chat belongs to Site Agent Replies.
    # Only explicit coordinator commands enter the full governance/bridge-crew control plane.
    if: >-
      github.event_name != 'issue_comment' ||
      startsWith(github.event.comment.body, '/coord ') ||
      github.event.comment.body == '/coord' ||
      startsWith(github.event.comment.body, '/coordinate ') ||
      github.event.comment.body == '/coordinate' ||
      startsWith(github.event.comment.body, '/seven ') ||
      github.event.comment.body == '/seven' ||
      startsWith(github.event.comment.body, '@seven ') ||
      startsWith(github.event.comment.body, '@seven-of-nine ') ||
      startsWith(github.event.comment.body, '@coordinator ')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate shared THRIVE / Venus / Реновация / Рубежи mission
        run: node scripts/mission-alignment.js

      - name: Validate post-scarcity civilization doctrine
        run: node -e "const d=require('./scripts/doctrine').loadDoctrine(); console.log('Doctrine', d.version)"

      - name: Coordinate contributors and refresh hubs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUANTDEUS_DISCORD_WEBHOOK: ${{ secrets.QUANTDEUS_DISCORD_WEBHOOK }}
          QUANTDEUS_SLACK_WEBHOOK: ${{ secrets.QUANTDEUS_SLACK_WEBHOOK }}
          QUANTDEUS_GENERIC_WEBHOOK: ${{ secrets.QUANTDEUS_GENERIC_WEBHOOK }}
          QUANTDEUS_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.QUANTDEUS_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM }}
          QUANTDEUS_TELEGRAM_CHAT_ID: ${{ secrets.QUANTDEUS_TELEGRAM_CHAT_ID }}
          QUANTDEUS_ADMIN_GITHUB_USERS: ${{ vars.QUANTDEUS_ADMIN_GITHUB_USERS }}
        run: |
          node scripts/governance-gate.js
          export QUANTDEUS_DIALOGUE_DEADLINE_MS=$(node -e 'process.stdout.write(String(Date.now()+420000))')
          if [ "${GITHUB_EVENT_NAME:-}" = "issue_comment" ]; then
            export QUANTDEUS_DIALOGUE_FORCE_RETRY=1
          fi
          bridge_fail=0
          run_stage() {
            stage="$1"
            shift
            if "$@"; then
              echo "Bridge crew stage OK: $stage"
            else
              rc=$?
              echo "::error title=Bridge crew stage failed::$stage exited with code $rc"
              bridge_fail=1
            fi
          }
          run_stage seven node scripts/seven-of-nine.js
          run_stage secretary node scripts/coordinator.js
          run_stage emh node scripts/emh.js
          run_stage sherlock node scripts/sherlock.js
          run_stage tuvok node scripts/tuvok.js
          run_stage strategic-hub node scripts/strategic-hub.js
          exit "$bridge_fail"

      - name: Preserve bridge crew inference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seven-reasoning-${{ github.run_id }}
          path: |
            /tmp/quantdeus-seven-reasoning.json
            /tmp/quantdeus-emh-cognitive-health.json
            /tmp/quantdeus-sherlock-reasoning.json
            /tmp/quantdeus-tuvok-reasoning.json
          if-no-files-found: ignore
          retention-days: 7
