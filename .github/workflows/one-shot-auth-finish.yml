name: QuantDeus Native WordPress MCP Check
run-name: "Настройка входа на сайт"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Проверить shared QuantDeus mission
        run: node scripts/mission-alignment.js

      - name: Проверить native WordPress MCP contract
        run: node scripts/qa/contract-validator.js
