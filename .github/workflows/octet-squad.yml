name: QuantDeus Octet Squad B — исполнительная команда ⚒️

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Номер одобренного Issue с задачей"
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: octet-squad-b-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  execute:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'squad-b:ready' && contains(github.event.issue.labels.*.name, 'coord:task'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      QUANTDEUS_ADMIN_GITHUB_USERS: ${{ vars.QUANTDEUS_ADMIN_GITHUB_USERS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: ⚒️ Запустить вторую исполнительную команду
        run: node scripts/octet/task-handler.js
