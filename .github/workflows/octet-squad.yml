name: QuantDeus Octet Squad B ⚒️

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Approved task Issue number"
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: octet-squad-b-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  execute:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'squad-b:ready' && contains(github.event.issue.labels.*.name, 'coord:task'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      QUANTDEUS_ADMIN_GITHUB_USERS: ${{ vars.QUANTDEUS_ADMIN_GITHUB_USERS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: ⚒️ Run second execution crew
        run: node scripts/octet/task-handler.js

  validate:
    needs: execute
    if: needs.execute.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EXECUTION_BRANCH: squad-b/issue-${{ github.event.issue.number || inputs.issue_number }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: 🦀 Dispatch immutable validation gates
        run: |
          gh workflow run static-smoke.yml --repo "$GITHUB_REPOSITORY" --ref "$EXECUTION_BRANCH"
          gh workflow run qa-triad.yml --repo "$GITHUB_REPOSITORY" --ref "$EXECUTION_BRANCH"
          echo "Dispatched validation for $EXECUTION_BRANCH"
