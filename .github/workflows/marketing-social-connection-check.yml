name: QuantDeus Social Fleet — VK + YouTube connection check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connection-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VK_TOKEN_GROUP: ${{ secrets.VK_TOKEN_GROUP }}
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate social integrations without publishing
        run: node scripts/marketing-social-connection-check.mjs
