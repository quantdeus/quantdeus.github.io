# Claude Code reviewer for Skyrim Mobile. This lives on main after config-only PR approval.
# On main: an OWNER-written "@claude ..." comment on PR #549 is the sole inference trigger.
# Push/PR events below validate configuration only (no model calls, no surprise spend).
name: Claude Code — Skyrim gated reviewer

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  push:
    branches: [feat/claude-code-action-skyrim]
    paths:
      - .github/workflows/claude-skyrim.yml
      - docs/claude-skyrim-action.md
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: claude-skyrim-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.actor == 'quantdeus' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/feat/claude-code-action-skyrim') ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/claude-code-action-skyrim') ||
        (github.event_name == 'issue_comment' && github.event.issue.number == 549 && startsWith(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && github.event.pull_request.number == 549 && startsWith(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      has_api: ${{ steps.auth.outputs.has_api }}
      has_oauth: ${{ steps.auth.outputs.has_oauth }}
    steps:
      - name: Detect configured authentication without printing credentials
        id: auth
        env:
          API_SET: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          OAUTH_SET: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          echo "has_api=$API_SET" >> "$GITHUB_OUTPUT"
          echo "has_oauth=$OAUTH_SET" >> "$GITHUB_OUTPUT"
          if [[ "$OAUTH_SET" == "true" ]]; then
            echo "Claude OAuth secret detected; OAuth is preferred."
          elif [[ "$API_SET" == "true" ]]; then
            echo "Anthropic API secret detected."
          else
            echo "::warning title=Claude authentication missing::Install official Claude GitHub App and configure CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY as a repository Actions secret."
          fi
          echo "Gate verified: owner-only, PR #549, explicit @claude, no bot triggers."

  missing-auth:
    needs: preflight
    if: >-
      needs.preflight.result == 'success' &&
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      needs.preflight.outputs.has_oauth != 'true' &&
      needs.preflight.outputs.has_api != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Explain missing Claude credential
        run: |
          echo "::error title=Claude is not yet authorized::Add CLAUDE_CODE_OAUTH_TOKEN (preferred) or ANTHROPIC_API_KEY under Settings → Secrets and variables → Actions, and install https://github.com/apps/claude for this repository."
          exit 1

  claude-review:
    needs: preflight
    if: >-
      needs.preflight.result == 'success' &&
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      (needs.preflight.outputs.has_oauth == 'true' || needs.preflight.outputs.has_api == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Check out target Skyrim feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/skyrim-mobile-webgl-500mb
          persist-credentials: false
          fetch-depth: 1

      - name: Review via Claude Code (OAuth, preferred)
        if: needs.preflight.outputs.has_oauth == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: '@claude'
          base_branch: feat/skyrim-mobile-webgl-500mb
          claude_args: |
            --max-turns 6
            --disallowedTools "Edit,Write,MultiEdit,Bash"

      - name: Review via Claude Code (Anthropic API fallback)
        if: needs.preflight.outputs.has_oauth != 'true' && needs.preflight.outputs.has_api == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: '@claude'
          base_branch: feat/skyrim-mobile-webgl-500mb
          claude_args: |
            --max-turns 6
            --disallowedTools "Edit,Write,MultiEdit,Bash"
