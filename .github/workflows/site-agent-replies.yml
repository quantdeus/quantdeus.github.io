name: QuantDeus Site Agent Replies
run-name: "Ответы агентов на сайте"

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  id-token: write

concurrency:
  group: qd-site-agent-${{ github.event.issue.number }}-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  reply:
    if: >
      github.event.issue.pull_request == null &&
      contains(fromJSON('[112,113,114,115]'), github.event.issue.number) &&
      github.event.comment.user.type != 'Bot' &&
      !contains(github.event.comment.body, '<!-- qd-agent-reply -->')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Route comment to live QuantDeus LLM agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUANTDEUS_ADMIN_GITHUB_USERS: ${{ vars.QUANTDEUS_ADMIN_GITHUB_USERS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openrouter/free
          QD_OPENROUTER_FREE_ONLY: "true"
          QD_OPENROUTER_ONLY: 'true'
          QD_OPENROUTER_FIRST: 'true'
          CLOUDFLARE_ACCOUNT_ID: 97ba2df0316dd1b7137e535c5f47cc76
          CLOUDFLARE_AI_GATEWAY_ID: quantdeus-openrouter
          CLOUDFLARE_AI_GATEWAY_TOKEN: ${{ secrets.CLOUDFLARE_AI_GATEWAY_TOKEN }}
          QD_LLM_PROVIDER: auto
          QD_LLM_MODEL: openrouter/free
        run: node scripts/site-agent-reply.js
