name: QuantDeus Site Agent Replies

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  id-token: write

concurrency:
  group: qd-site-agent-${{ github.event.issue.number }}-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  reply:
    if: >
      github.event.issue.pull_request == null &&
      contains(fromJSON('[112,113,114,115]'), github.event.issue.number) &&
      github.event.comment.user.type != 'Bot' &&
      !contains(github.event.comment.body, '<!-- qd-agent-reply -->')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Route comment to live QuantDeus LLM agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_GATEWAY_MODEL: ${{ vars.AI_GATEWAY_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QD_LLM_PROVIDER: auto
          QD_LLM_MODEL: openrouter/free
        run: node scripts/site-agent-reply.js
