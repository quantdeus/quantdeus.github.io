name: QuantDeus — три маркетинговые воронки (без отправки)
on:
  schedule:
    - cron: '37 8 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quantdeus-three-funnel-pilot
  cancel-in-progress: true
jobs:
  validate-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Проверить защитные ограничения пилота
        run: node --test scripts/qa/growth-three-funnel-pilot.test.mjs
      - name: Проверить три воронки и запрет внешней отправки
        run: node scripts/growth-three-funnel-pilot.mjs
