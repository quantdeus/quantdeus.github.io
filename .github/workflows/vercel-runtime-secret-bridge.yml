name: QuantDeus Vercel Runtime Secret Bridge
# Re-run on 2026-10-03 after Store Bot no-reply evidence to synchronize Telegram delivery secrets into production.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vercel-runtime-secret-bridge.yml'

permissions:
  contents: read

jobs:
  sync-production-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate secret bridge inputs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TELEGRAM_DELIVERY_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.QUANTDEUS_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM }}
          OWNER_TELEGRAM_IDS: ${{ secrets.QUANTDEUS_OWNER_TELEGRAM_IDS || vars.QUANTDEUS_OWNER_TELEGRAM_IDS || vars.TELEGRAM_ADMIN_USER_IDS }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${VERCEL_TOKEN}" ]; then echo "::error::VERCEL_TOKEN is not configured"; missing=1; fi
          if [ -z "${TELEGRAM_DELIVERY_TOKEN}" ]; then echo "::error::Telegram bot token is not configured"; missing=1; fi
          if [ -z "${OWNER_TELEGRAM_IDS}" ]; then echo "::error::Owner/admin Telegram ID variable is not configured"; missing=1; fi
          exit "${missing}"

      - name: Upsert Vercel production delivery inputs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TELEGRAM_DELIVERY_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.QUANTDEUS_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM }}
          OWNER_TELEGRAM_IDS: ${{ secrets.QUANTDEUS_OWNER_TELEGRAM_IDS || vars.QUANTDEUS_OWNER_TELEGRAM_IDS || vars.TELEGRAM_ADMIN_USER_IDS }}
          VERCEL_PROJECT_ID: prj_GxT9uteQljWWVCOhcrdocHkqypkg
          VERCEL_TEAM_ID: team_Ku6cnMeui0VkjPtD1FCMz0MF
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const payload = [
            {
              key: 'TELEGRAM_BOT_TOKEN',
              value: process.env.TELEGRAM_DELIVERY_TOKEN,
              type: 'sensitive',
              target: ['production'],
              comment: 'QuantDeus Store guest inquiry server delivery'
            },
            {
              key: 'QUANTDEUS_OWNER_TELEGRAM_IDS',
              value: process.env.OWNER_TELEGRAM_IDS,
              type: 'sensitive',
              target: ['production'],
              comment: 'QuantDeus Store owner delivery target'
            }
          ];
          if (payload.some(item => !item.value)) process.exit(2);
          fs.writeFileSync('vercel-env.json', JSON.stringify(payload), { mode: 0o600 });
          NODE
          status="$(curl --silent --show-error --output vercel-response.json --write-out '%{http_code}' \
            --request POST \
            --url "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?upsert=true&teamId=${VERCEL_TEAM_ID}" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @vercel-env.json)"
          rm -f vercel-env.json vercel-response.json
          case "${status}" in
            200|201) ;;
            *) echo "::error::Vercel env upsert failed with HTTP ${status}"; exit 1 ;;
          esac
          echo "Vercel production Telegram delivery inputs synced; secret values were not logged." >> "${GITHUB_STEP_SUMMARY}"
