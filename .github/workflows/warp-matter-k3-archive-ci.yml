name: 🍌 Банановая лаборатория — архив Кардашёва III
on:
  push:
    branches:
      - research/warp-matter-python-parser-20261102
    paths:
      - 'scripts/warp_matter_*'
      - 'tests/test_warp_matter_*'
      - 'research/warp-matter/archives/**'
      - 'coordination/research/warp-matter-k3-literature.json'
      - '.github/workflows/warp-matter-k3-archive-ci.yml'
  pull_request:
    paths:
      - 'scripts/warp_matter_*'
      - 'tests/test_warp_matter_*'
      - 'research/warp-matter/archives/**'
      - 'coordination/research/warp-matter-k3-literature.json'
      - '.github/workflows/warp-matter-k3-archive-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Проверить Python-разборщик архива и список исследований
        run: |
          python3 -m unittest discover -s tests -p 'test_warp_matter_*.py' -v
      - name: Разобрать только существующие результаты qBraid 24–25 октября
        run: |
          python3 scripts/warp_matter_k3_audit.py --output /tmp/warp-matter-k3-audit.md
          cat /tmp/warp-matter-k3-audit.md
      - name: Сохранить отчёт для независимой проверки
        uses: actions/upload-artifact@v4
        with:
          name: warp-matter-k3-readonly-report
          path: /tmp/warp-matter-k3-audit.md
          retention-days: 30
