name: QuantDeus — почта, тест клиента PressedMail

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'wordpress/webmail-playground-blueprint.json'
      - '.github/workflows/webmail-wordpress-playground.yml'
      - 'coordination/growth/webmail-pressedmail-plan.md'

permissions:
  contents: read

concurrency:
  group: quantdeus-webmail-wordpress-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plugin-smoke:
    name: Установка PressedMail в одноразовом WordPress (без писем)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Контракт публичного теста без секретов
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('wordpress/webmail-playground-blueprint.json','utf8'));
          if(x.steps.length!==2)throw Error('Unexpected blueprint steps');
          if(x.steps[0].step!=='installPlugin'||
             x.steps[0].pluginData.resource!=='wordpress.org/plugins'||
             x.steps[0].pluginData.slug!=='pressedmail'||
             x.steps[0].options?.activate!==true)throw Error('Official PressedMail installation not configured');
          if(x.steps[1].step!=='runPHP'||!x.steps[1].code.includes('QD_WEBMAIL_PLUGIN_ACTIVATION_OK'))
            throw Error('Missing activation smoke');
          const s=fs.readFileSync('coordination/growth/webmail-pressedmail-plan.md','utf8');
          if(!s.includes('info@quantdeus.ru')||!s.includes('IMAP')||!s.includes('SMTP')||!s.includes('НЕ НАСТРОЕН'))
            throw Error('Handoff data missing');
          if(/wp_mail\s*\(|wp_remote_post\s*\(|\bpassword\s*=\s*['"][^'"]+/.test(JSON.stringify(x)))
            throw Error('No outbound mail, API posts or secrets in testing blueprint');
          console.log('WordPress webmail plan and official plugin install contract OK');
          NODE
      - name: Временный WordPress Playground
        run: npx -y @wp-playground/cli@latest run-blueprint --blueprint=wordpress/webmail-playground-blueprint.json
      - name: Итог проверки
        if: success()
        run: |
          echo '## QuantDeus Webmail: activation smoke' >> "$GITHUB_STEP_SUMMARY"
          echo 'PressedMail activated in disposable WordPress Playground. IMAP/SMTP mailbox setup was NOT tested: Playground uses SQLite, while real PressedMail mailbox setup needs MariaDB/MySQL.' >> "$GITHUB_STEP_SUMMARY"
