name: OpenRouter Secret Smoke Test

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenRouter model ID
        required: true
        type: string
        default: openai/gpt-4o-mini

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate secret is configured
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Repository secret OPENROUTER_API_KEY is missing."
            exit 1
          fi
          echo "OpenRouter secret is present (value hidden)."

      - name: Send minimal request
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL: ${{ inputs.model }}
          RESPONSE_FILE: ${{ runner.temp }}/openrouter-response.json
          REQUEST_FILE: ${{ runner.temp }}/openrouter-request.json
        run: |
          python - <<'PY'
          import json, os
          with open(os.environ["REQUEST_FILE"], "w", encoding="utf-8") as f:
              json.dump({
                  "model": os.environ["MODEL"],
                  "messages": [{"role": "user", "content": "Reply with exactly: OK"}],
                  "max_tokens": 8
              }, f)
          PY

          status=$(curl --silent --show-error \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            --connect-timeout 15 --max-time 90 \
            https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary "@$REQUEST_FILE")

          echo "OpenRouter HTTP status: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::OpenRouter request failed (HTTP $status). Response body intentionally not printed."
            exit 1
          fi

          python - <<'PY'
          import json, os, sys
          with open(os.environ["RESPONSE_FILE"], encoding="utf-8") as f:
              data = json.load(f)
          if not data.get("choices") or not data["choices"][0].get("message"):
              print("::error::Response did not contain a chat message.")
              sys.exit(1)
          usage = data.get("usage") or {}
          print("OpenRouter response validated; model:", data.get("model", "unknown"))
          print("Token usage:", usage.get("prompt_tokens", "?"), "prompt /",
                usage.get("completion_tokens", "?"), "completion")
          print("Response text was not printed.")
          PY
