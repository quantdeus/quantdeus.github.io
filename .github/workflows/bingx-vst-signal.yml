name: QuantDeus BingX VST Autotrade

on:
  schedule:
    - cron: '*/15 * * * *' # every 15 minutes; canonical GitHub scheduler cadence
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Both flags must be deliberately configured before LIVE order submission.
# Default remains simulated VST, never auto-migrate real funds.
env:
  # The installed API keys belong to a real perpetual futures account.
  # Keep live MARKET execution disabled until account-mode and protection QA.
  BINGX_TRADING_ENV: prod-live
  QUANTDEUS_BINGX_LIVE_TRADING_ENABLED: 'false'

concurrency:
  group: quantdeus-bingx-vst-signal
  cancel-in-progress: true

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Validate shared QuantDeus mission
        run: node scripts/mission-alignment.js

      - name: Run GitHub-native guarded BingX VST autotrade cycle
        id: github_native
        continue-on-error: true
        working-directory: vercel-dispatcher
        env:
          QUANTDEUS_BINGX_VST_REMOTE_BROKER_URL: https://quantdeus.vercel.app/api/quantdeus/bingx-vst-private-broker
          QUANTDEUS_BINGX_VST_TRADING_ENABLED: 'true'
          BINGX_VST_SYMBOL_MODE: all
        run: |
          npm install --omit=dev --no-audit --no-fund
          node scripts/run-bingx-vst-native.mjs

      - name: Run Vercel VST fallback
        # A crashed live run may have submitted an order; never retry via a
        # second provider before human reconciliation of live positions.
        if: steps.github_native.outcome == 'failure' && env.BINGX_TRADING_ENV != 'prod-live'
        working-directory: vercel-dispatcher
        run: node scripts/run-bingx-vst-vercel-fallback.mjs
