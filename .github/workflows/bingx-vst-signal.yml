name: QuantDeus BingX VST Demo Autotrade

on:
  schedule:
    - cron: '*/15 * * * *' # every 15 minutes; canonical GitHub scheduler cadence
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: quantdeus-bingx-vst-signal
  cancel-in-progress: true

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Validate shared QuantDeus mission
        run: node scripts/mission-alignment.js

      - name: Run GitHub-native guarded BingX VST demo cycle
        id: github_native
        continue-on-error: true
        working-directory: vercel-dispatcher
        env:
          QUANTDEUS_BINGX_VST_REMOTE_BROKER_URL: https://quantdeus.vercel.app/api/quantdeus/bingx-vst-private-broker
          QUANTDEUS_BINGX_VST_TRADING_ENABLED: 'true'
          BINGX_VST_SYMBOL_MODE: all
        run: |
          npm install --omit=dev --no-audit --no-fund
          node scripts/run-bingx-vst-native.mjs

      - name: Run Vercel VST demo fallback
        if: steps.github_native.outcome == 'failure'
        working-directory: vercel-dispatcher
        run: node scripts/run-bingx-vst-vercel-fallback.mjs
