name: QuantDeus — безопасный мост GitHub, WordPress и Cloudflare

on:
  pull_request:
    paths:
      - ".github/workflows/federation-bridge.yml"
      - "coordination/federation-bridge.json"
      - "coordination/qdrp-wordpress-site-access.json"
      - "scripts/quantdeus-federation-bridge.mjs"
      - "scripts/tests/federation-bridge.test.mjs"
  workflow_dispatch:

# Deliberately no write permissions and no integration credentials.
permissions:
  contents: read

concurrency:
  group: qdrp-federation-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Проверка разрешений QDRP и публичных данных WordPress
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Получить проверяемую ветку
        uses: actions/checkout@v4

      - name: Подготовить Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Проверить права QDRP и связи Cloudflare
        run: node --test scripts/tests/federation-bridge.test.mjs

      - name: Собрать предварительный снимок публичных данных
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/quantdeus-federation-bridge.mjs snapshot --out "$RUNNER_TEMP/quantdeus-federation-public-preview.json"

      - name: Сохранить временный отчёт без записи на сайт
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: quantdeus-federation-public-preview
          path: ${{ runner.temp }}/quantdeus-federation-public-preview.json
          retention-days: 3
