name: Seven of Nine Swarm Smoke 🖖

on:
  push:
    branches: [agent-review-discipline-v1]
    paths:
      - '.github/workflows/seven-of-nine-smoke.yml'

permissions:
  contents: read
  issues: write

jobs:
  seven:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 🖖 Run Seven of Nine swarm efficiency scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUANTDEUS_COORDINATION_HUB_ISSUE: '9'
        run: node scripts/seven-of-nine.js
