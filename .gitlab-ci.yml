image: node:22-alpine

stages:
  - continuity

variables:
  GIT_DEPTH: "0"

swarm-continuity:
  stage: continuity
  script:
    - node --version
    - node -e "const fs=require('fs'); const required=['AGENTS.md','coordination/agents.json','coordination/homunculi.json','coordination/agent-cron-map.json','coordination/civilization-doctrine.json','scripts/mission-alignment.js']; for(const f of required){if(!fs.existsSync(f)) throw new Error('missing '+f)}; const a=JSON.parse(fs.readFileSync('coordination/agents.json')); const h=JSON.parse(fs.readFileSync('coordination/homunculi.json')); if(!Array.isArray(a.agents)||a.agents.length<26) throw new Error('agent registry incomplete'); if(!Array.isArray(h.agents)||h.agents.length<11) throw new Error('homunculi registry incomplete'); const ids=a.agents.map(x=>x.id); if(new Set(ids).size!==ids.length) throw new Error('duplicate agent ids'); console.log('GitLab standby continuity OK; agents='+ids.length+' homunculi='+h.agents.length)"
    - node --check scripts/mission-alignment.js
    - node --check scripts/openclaw-office-client.js
    - node --check scripts/orchestrator.js
    - node --check scripts/strategic-hub.js
    - node --check scripts/telegram-bot.js
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'