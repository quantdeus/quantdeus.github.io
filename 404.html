<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="robots" content="noindex,follow">
  <title>QuantDeus — GitHub Pages Mirror</title>
  <link id="canonical" rel="canonical" href="https://quantdeus.vercel.app/">
  <style>
    html,body{width:100%;height:100%;margin:0;background:#0b0b0b;overflow:hidden}
    #mirror{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
    #boot{position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:#0b0b0b;color:#fff;font:500 16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center;padding:24px}
    #boot small{display:block;opacity:.65;margin-top:8px}
    #boot a{color:#fff}
    .ready #boot{display:none}
  </style>
</head>
<body>
  <div id="boot">🪞 QuantDeus mirror загружается…<small>Источник: quantdeus.vercel.app</small></div>
  <iframe id="mirror" title="QuantDeus" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <noscript><p style="color:white;padding:24px;font-family:system-ui">Для зеркала нужен JavaScript. <a href="https://quantdeus.vercel.app/">Открыть QuantDeus</a>.</p></noscript>
  <script>
    (() => {
      const origin = 'https://quantdeus.vercel.app';
      const path = location.pathname + location.search + location.hash;
      const target = new URL(path, origin).href;
      const canonical = document.getElementById('canonical');
      canonical.href = target;
      const frame = document.getElementById('mirror');
      frame.addEventListener('load', () => document.documentElement.classList.add('ready'), {once:true});
      frame.src = target;
      setTimeout(() => document.documentElement.classList.add('ready'), 8000);
    })();
  </script>
</body>
</html>
